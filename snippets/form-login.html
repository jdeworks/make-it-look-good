<!-- snippet: form-login, category: forms, rationale: components/forms.md, tags: login, authentication, email, password, remember-me, dark-mode: yes, frameworks: react/vue for login, signup, search-bar -->

<form class="w-full max-w-sm mx-auto space-y-4" aria-label="Login" novalidate>
  <div>
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Sign in</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Welcome back. Enter your credentials to continue.</p>
  </div>

  <div>
    <label for="login-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
    <input
      type="email"
      id="login-email"
      name="email"
      autocomplete="email"
      required
      placeholder="you@example.com"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
  </div>

  <div>
    <label for="login-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
    <input
      type="password"
      id="login-password"
      name="password"
      autocomplete="current-password"
      required
      placeholder="Enter your password"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
  </div>

  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <input
        type="checkbox"
        id="login-remember"
        name="remember"
        class="h-4 w-4 rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-2 focus:ring-blue-500 bg-white dark:bg-slate-700"
      />
      <label for="login-remember" class="text-sm text-slate-600 dark:text-slate-400">Remember me</label>
    </div>
    <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300">Forgot password?</a>
  </div>

  <button
    type="submit"
    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-lg text-base transition-colors min-h-11"
  >
    Sign in
  </button>

  <p class="text-center text-sm text-slate-500 dark:text-slate-400">
    Don't have an account?
    <a href="#" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300">Sign up</a>
  </p>
</form>
