<!-- snippet: btn-system, category: buttons, rationale: components/buttons.md, tags: button, primary, secondary, ghost, icon, loading, disabled, sizes, dark-mode: yes, frameworks: none -->

<div class="space-y-10 p-6 bg-white dark:bg-slate-900">

  <!-- ============================================
       EMPHASIS LEVELS
       ============================================ -->
  <section>
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-4">Emphasis Levels</h3>
    <div class="flex flex-wrap items-center gap-4">
      <!-- Primary -->
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 active:bg-blue-700 transition-colors"
      >
        Primary
      </button>
      <!-- Secondary (outline) -->
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 active:bg-slate-100 dark:active:bg-slate-600 transition-colors"
      >
        Secondary
      </button>
      <!-- Ghost (text) -->
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg px-4 py-2.5 min-h-[44px] text-sm font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 active:bg-slate-200 dark:active:bg-slate-700 transition-colors"
      >
        Ghost
      </button>
    </div>
  </section>

  <!-- ============================================
       SIZES
       ============================================ -->
  <section>
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-4">Sizes</h3>
    <div class="flex flex-wrap items-end gap-4">
      <!-- Small -->
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-md bg-blue-600 px-3 py-1.5 min-h-[44px] text-xs font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        Small
      </button>
      <!-- Medium (default) -->
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        Medium
      </button>
      <!-- Large -->
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-6 py-3 min-h-[48px] text-base font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        Large
      </button>
    </div>
  </section>

  <!-- ============================================
       DISABLED STATE
       ============================================ -->
  <section>
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-4">Disabled</h3>
    <div class="flex flex-wrap items-center gap-4">
      <button
        type="button"
        disabled
        aria-disabled="true"
        class="inline-flex items-center justify-center rounded-lg bg-blue-600/50 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-white/70 shadow-sm cursor-not-allowed"
      >
        Primary Disabled
      </button>
      <button
        type="button"
        disabled
        aria-disabled="true"
        class="inline-flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-slate-400 dark:text-slate-500 shadow-sm cursor-not-allowed"
      >
        Secondary Disabled
      </button>
    </div>
  </section>

  <!-- ============================================
       ICON + TEXT
       ============================================ -->
  <section>
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-4">Icon + Text</h3>
    <div class="flex flex-wrap items-center gap-4">
      <!-- Leading icon -->
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
        </svg>
        Add item
      </button>
      <!-- Trailing icon -->
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        Download
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.75 2.75a.75.75 0 0 0-1.5 0v8.614L6.295 8.235a.75.75 0 1 0-1.09 1.03l4.25 4.5a.75.75 0 0 0 1.09 0l4.25-4.5a.75.75 0 0 0-1.09-1.03l-2.955 3.129V2.75Z" />
          <path d="M3.5 12.75a.75.75 0 0 0-1.5 0v2.5A2.75 2.75 0 0 0 4.75 18h10.5A2.75 2.75 0 0 0 18 15.25v-2.5a.75.75 0 0 0-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5Z" />
        </svg>
      </button>
    </div>
  </section>

  <!-- ============================================
       ICON ONLY
       ============================================ -->
  <section>
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-4">Icon Only</h3>
    <div class="flex flex-wrap items-center gap-4">
      <!-- Primary icon-only -->
      <button
        type="button"
        aria-label="Add item"
        class="inline-flex items-center justify-center rounded-lg bg-blue-600 p-2.5 min-w-[44px] min-h-[44px] text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
        </svg>
      </button>
      <!-- Secondary icon-only -->
      <button
        type="button"
        aria-label="Edit"
        class="inline-flex items-center justify-center rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 p-2.5 min-w-[44px] min-h-[44px] text-slate-700 dark:text-slate-200 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="m5.433 13.917 1.262-3.155A4 4 0 0 1 7.58 9.42l6.92-6.918a2.121 2.121 0 0 1 3 3l-6.92 6.918c-.383.383-.84.685-1.343.886l-3.154 1.262a.5.5 0 0 1-.65-.65Z" />
          <path d="M3.5 5.75c0-.69.56-1.25 1.25-1.25h5.5a.75.75 0 0 0 0-1.5h-5.5A2.75 2.75 0 0 0 2 5.75v8.5A2.75 2.75 0 0 0 4.75 17h8.5A2.75 2.75 0 0 0 16 14.25v-5.5a.75.75 0 0 0-1.5 0v5.5c0 .69-.56 1.25-1.25 1.25h-8.5c-.69 0-1.25-.56-1.25-1.25v-8.5Z" />
        </svg>
      </button>
      <!-- Ghost icon-only -->
      <button
        type="button"
        aria-label="More options"
        class="inline-flex items-center justify-center rounded-lg p-2.5 min-w-[44px] min-h-[44px] text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-colors"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM10 8.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM11.5 15.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" />
        </svg>
      </button>
    </div>
  </section>

  <!-- ============================================
       LOADING STATE
       ============================================ -->
  <section>
    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-4">Loading</h3>
    <div class="flex flex-wrap items-center gap-4">
      <!-- Primary loading -->
      <button
        type="button"
        disabled
        aria-disabled="true"
        aria-busy="true"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600/80 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-white shadow-sm cursor-wait"
      >
        <svg class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Zm2 5.291A7.962 7.962 0 0 1 4 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647Z"></path>
        </svg>
        Saving...
      </button>
      <!-- Secondary loading -->
      <button
        type="button"
        disabled
        aria-disabled="true"
        aria-busy="true"
        class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-2.5 min-h-[44px] text-sm font-semibold text-slate-400 dark:text-slate-500 shadow-sm cursor-wait"
      >
        <svg class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Zm2 5.291A7.962 7.962 0 0 1 4 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647Z"></path>
        </svg>
        Loading...
      </button>
    </div>
  </section>

</div>
