<!-- snippet: form-search-bar, category: forms, rationale: components/forms.md, tags: search, filter, dropdown, icon, dark-mode: yes, frameworks: react/vue for login, signup, search-bar -->

<form class="w-full" role="search" aria-label="Search">
  <div class="relative flex items-center">
    <!-- Magnifying glass icon -->
    <svg class="absolute left-3 h-5 w-5 text-slate-400 pointer-events-none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
    </svg>

    <label for="search-input" class="sr-only">Search</label>
    <input
      type="search"
      id="search-input"
      name="q"
      placeholder="Search..."
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg pl-10 pr-24 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />

    <!-- Filter dropdown button -->
    <div class="absolute right-1.5">
      <label for="search-filter" class="sr-only">Filter</label>
      <select
        id="search-filter"
        name="filter"
        class="appearance-none rounded-md border border-slate-200 dark:border-slate-500 bg-slate-50 dark:bg-slate-600 text-sm text-slate-700 dark:text-slate-200 pl-2.5 pr-7 py-1.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none cursor-pointer"
      >
        <option value="all">All</option>
        <option value="posts">Posts</option>
        <option value="users">Users</option>
        <option value="tags">Tags</option>
      </select>
      <svg class="absolute right-2 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400 pointer-events-none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
      </svg>
    </div>
  </div>
</form>
