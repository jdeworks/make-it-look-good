<!-- snippet: form-signup, category: forms, rationale: components/forms.md, tags: signup, registration, password-strength, terms, dark-mode: yes, frameworks: react/vue for login, signup, search-bar -->

<form class="w-full max-w-sm mx-auto space-y-4" aria-label="Sign up" novalidate>
  <div>
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Create account</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Fill in your details to get started.</p>
  </div>

  <div>
    <label for="signup-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Full name</label>
    <input
      type="text"
      id="signup-name"
      name="name"
      autocomplete="name"
      required
      placeholder="Jane Doe"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
  </div>

  <div>
    <label for="signup-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
    <input
      type="email"
      id="signup-email"
      name="email"
      autocomplete="email"
      required
      placeholder="you@example.com"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
  </div>

  <div>
    <label for="signup-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
    <input
      type="password"
      id="signup-password"
      name="password"
      autocomplete="new-password"
      required
      placeholder="Create a password"
      aria-describedby="password-hint"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
    <p id="password-hint" class="mt-1.5 text-xs text-slate-500 dark:text-slate-400">Must be at least 8 characters with a number and a symbol.</p>
  </div>

  <div>
    <label for="signup-confirm-password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Confirm password</label>
    <input
      type="password"
      id="signup-confirm-password"
      name="confirm_password"
      autocomplete="new-password"
      required
      placeholder="Repeat your password"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
  </div>

  <div class="flex items-start gap-2">
    <input
      type="checkbox"
      id="signup-terms"
      name="terms"
      required
      class="mt-0.5 h-4 w-4 rounded border-slate-300 dark:border-slate-600 text-blue-600 focus:ring-2 focus:ring-blue-500 bg-white dark:bg-slate-700"
    />
    <label for="signup-terms" class="text-sm text-slate-600 dark:text-slate-400">
      I agree to the <a href="#" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300">Terms of Service</a> and <a href="#" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300">Privacy Policy</a>
    </label>
  </div>

  <button
    type="submit"
    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-lg text-base transition-colors min-h-11"
  >
    Create account
  </button>

  <p class="text-center text-sm text-slate-500 dark:text-slate-400">
    Already have an account?
    <a href="#" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300">Sign in</a>
  </p>
</form>
