<!-- snippet: form-settings, category: forms, rationale: components/forms.md, tags: settings, profile, notifications, toggles, sections, dark-mode: yes, frameworks: none -->

<form class="w-full max-w-lg mx-auto space-y-8" aria-label="Settings" novalidate>
  <div>
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Settings</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Manage your profile and preferences.</p>
  </div>

  <!-- Profile section -->
  <fieldset class="space-y-4">
    <legend class="text-lg font-semibold text-slate-900 dark:text-white">Profile</legend>

    <div>
      <label for="settings-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Full name</label>
      <input
        type="text"
        id="settings-name"
        name="name"
        autocomplete="name"
        class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
      />
    </div>

    <div>
      <label for="settings-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
      <input
        type="email"
        id="settings-email"
        name="email"
        autocomplete="email"
        class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
      />
    </div>

    <div>
      <label for="settings-bio" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Bio</label>
      <textarea
        id="settings-bio"
        name="bio"
        rows="4"
        placeholder="Tell us about yourself"
        class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y"
      ></textarea>
    </div>
  </fieldset>

  <!-- Notifications section -->
  <fieldset class="space-y-4">
    <legend class="text-lg font-semibold text-slate-900 dark:text-white">Notifications</legend>

    <div class="flex items-center justify-between min-h-11">
      <label for="settings-notify-email" class="text-sm font-medium text-slate-700 dark:text-slate-300">Email notifications</label>
      <button
        type="button"
        id="settings-notify-email"
        role="switch"
        aria-checked="true"
        class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800"
        onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); this.classList.toggle('bg-blue-600'); this.classList.toggle('bg-slate-300'); this.classList.toggle('dark:bg-slate-500'); this.querySelector('span').classList.toggle('translate-x-5'); this.querySelector('span').classList.toggle('translate-x-0');"
      >
        <span class="pointer-events-none inline-block h-5 w-5 translate-x-5 rounded-full bg-white shadow ring-0 transition-transform"></span>
      </button>
    </div>

    <div class="flex items-center justify-between min-h-11">
      <label for="settings-notify-push" class="text-sm font-medium text-slate-700 dark:text-slate-300">Push notifications</label>
      <button
        type="button"
        id="settings-notify-push"
        role="switch"
        aria-checked="false"
        class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-slate-300 dark:bg-slate-500 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800"
        onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); this.classList.toggle('bg-blue-600'); this.classList.toggle('bg-slate-300'); this.classList.toggle('dark:bg-slate-500'); this.querySelector('span').classList.toggle('translate-x-5'); this.querySelector('span').classList.toggle('translate-x-0');"
      >
        <span class="pointer-events-none inline-block h-5 w-5 translate-x-0 rounded-full bg-white shadow ring-0 transition-transform"></span>
      </button>
    </div>

    <div class="flex items-center justify-between min-h-11">
      <label for="settings-notify-marketing" class="text-sm font-medium text-slate-700 dark:text-slate-300">Marketing emails</label>
      <button
        type="button"
        id="settings-notify-marketing"
        role="switch"
        aria-checked="false"
        class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-slate-300 dark:bg-slate-500 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800"
        onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); this.classList.toggle('bg-blue-600'); this.classList.toggle('bg-slate-300'); this.classList.toggle('dark:bg-slate-500'); this.querySelector('span').classList.toggle('translate-x-5'); this.querySelector('span').classList.toggle('translate-x-0');"
      >
        <span class="pointer-events-none inline-block h-5 w-5 translate-x-0 rounded-full bg-white shadow ring-0 transition-transform"></span>
      </button>
    </div>
  </fieldset>

  <!-- Actions -->
  <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
    <button
      type="button"
      class="px-4 py-2.5 rounded-lg text-base font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600 transition-colors min-h-11"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-lg text-base transition-colors min-h-11"
    >
      Save changes
    </button>
  </div>
</form>
