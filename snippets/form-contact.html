<!-- snippet: form-contact, category: forms, rationale: components/forms.md, tags: contact, message, subject, textarea, dark-mode: yes, frameworks: none -->

<form class="w-full max-w-lg mx-auto space-y-4" aria-label="Contact us" novalidate>
  <div>
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Contact us</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Have a question? Send us a message and we'll get back to you.</p>
  </div>

  <div>
    <label for="contact-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Name</label>
    <input
      type="text"
      id="contact-name"
      name="name"
      autocomplete="name"
      required
      placeholder="Your name"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
  </div>

  <div>
    <label for="contact-email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
    <input
      type="email"
      id="contact-email"
      name="email"
      autocomplete="email"
      required
      placeholder="you@example.com"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11"
    />
  </div>

  <div>
    <label for="contact-subject" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Subject</label>
    <select
      id="contact-subject"
      name="subject"
      required
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11 appearance-none"
    >
      <option value="" disabled selected>Select a subject</option>
      <option value="general">General inquiry</option>
      <option value="support">Technical support</option>
      <option value="billing">Billing question</option>
      <option value="feedback">Feedback</option>
      <option value="other">Other</option>
    </select>
  </div>

  <div>
    <label for="contact-message" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Message</label>
    <textarea
      id="contact-message"
      name="message"
      rows="5"
      required
      placeholder="How can we help?"
      class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y"
    ></textarea>
  </div>

  <button
    type="submit"
    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-lg text-base transition-colors min-h-11"
  >
    Send message
  </button>
</form>
