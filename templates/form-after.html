<!--
  AFTER: Form — Single column, proper labels, accessible targets, clear grouping
  Demonstrates:
  - components/forms.md — Labels above fields, logical grouping, clear validation hints
  - layout/spacing-system.md — Consistent 4px-based spacing between fields and groups
  - interaction/touch-targets.md — 44px minimum touch target on all interactive elements
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - After</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <div class="max-w-md mx-auto mt-16 mb-16 px-6">
    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-gray-900 mb-2">Create your account</h1>
      <p class="text-gray-500">Get started with a free 14-day trial. No credit card required.</p>
    </div>

    <form class="space-y-6" novalidate>
      <!-- Personal Info Group -->
      <fieldset>
        <legend class="text-sm font-semibold text-gray-900 mb-4">Personal Information</legend>
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="first-name" class="block text-sm font-medium text-gray-700 mb-1.5">First name</label>
              <input type="text" id="first-name" autocomplete="given-name"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow">
            </div>
            <div>
              <label for="last-name" class="block text-sm font-medium text-gray-700 mb-1.5">Last name</label>
              <input type="text" id="last-name" autocomplete="family-name"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow">
            </div>
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
            <input type="email" id="email" autocomplete="email"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow"
              placeholder="you@company.com">
            <p class="mt-1.5 text-sm text-gray-400">We'll send a verification link to this address.</p>
          </div>
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-1.5">Phone <span class="text-gray-400 font-normal">(optional)</span></label>
            <input type="tel" id="phone" autocomplete="tel"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow">
          </div>
        </div>
      </fieldset>

      <!-- Password Group -->
      <fieldset>
        <legend class="text-sm font-semibold text-gray-900 mb-4">Set a Password</legend>
        <div class="space-y-4">
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
            <input type="password" id="password" autocomplete="new-password"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-base text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow">
            <p class="mt-1.5 text-sm text-gray-400">At least 8 characters with a number and a symbol.</p>
          </div>
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm password</label>
            <input type="password" id="confirm-password" autocomplete="new-password"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-base text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow">
          </div>
        </div>
      </fieldset>

      <!-- Company Group -->
      <fieldset>
        <legend class="text-sm font-semibold text-gray-900 mb-4">Company <span class="text-gray-400 font-normal">(optional)</span></legend>
        <div>
          <label for="company" class="block text-sm font-medium text-gray-700 mb-1.5">Company name</label>
          <input type="text" id="company" autocomplete="organization"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow">
        </div>
      </fieldset>

      <!-- Terms -->
      <div class="flex items-start gap-3">
        <input type="checkbox" id="terms" class="mt-0.5 w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
        <label for="terms" class="text-sm text-gray-600 leading-snug">
          I agree to the <a href="#" class="text-blue-600 underline hover:text-blue-800">Terms of Service</a> and <a href="#" class="text-blue-600 underline hover:text-blue-800">Privacy Policy</a>.
        </label>
      </div>

      <!-- Submit — 44px min height -->
      <button type="submit"
        class="w-full bg-blue-600 text-white font-medium text-base px-6 py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
        style="min-height: 44px;">
        Create Account
      </button>

      <p class="text-center text-sm text-gray-500">
        Already have an account? <a href="#" class="text-blue-600 font-medium hover:text-blue-800">Sign in</a>
      </p>
    </form>
  </div>
</body>
</html>
