<!--
  BEFORE: Form — Cluttered layout, ambiguous labels, tiny click targets
  Issues demonstrated:
  - Side-by-side fields that don't need it (e.g., email + phone in same row)
  - Placeholder-only labels (no visible labels above fields)
  - Small submit button with poor target size
  - No field grouping or logical sections
  - Inconsistent field sizing
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Before</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 text-gray-700 text-sm">
  <div class="max-w-2xl mx-auto mt-6 bg-white p-4 rounded shadow">
    <div class="font-bold text-lg mb-3">Create Account</div>
    <form>
      <div class="flex gap-2 mb-2">
        <input type="text" placeholder="First name" class="border rounded px-2 py-1 text-sm flex-1">
        <input type="text" placeholder="Last name" class="border rounded px-2 py-1 text-sm flex-1">
      </div>
      <div class="flex gap-2 mb-2">
        <input type="email" placeholder="Email address" class="border rounded px-2 py-1 text-sm flex-1">
        <input type="tel" placeholder="Phone" class="border rounded px-2 py-1 text-sm w-36">
      </div>
      <div class="flex gap-2 mb-2">
        <input type="password" placeholder="Password" class="border rounded px-2 py-1 text-sm flex-1">
        <input type="password" placeholder="Confirm password" class="border rounded px-2 py-1 text-sm flex-1">
      </div>
      <div class="mb-2">
        <input type="text" placeholder="Company (optional)" class="border rounded px-2 py-1 text-sm w-full">
      </div>
      <div class="flex gap-2 mb-2">
        <input type="text" placeholder="Address" class="border rounded px-2 py-1 text-sm flex-1">
        <input type="text" placeholder="City" class="border rounded px-2 py-1 text-sm w-32">
        <input type="text" placeholder="ZIP" class="border rounded px-2 py-1 text-sm w-20">
      </div>
      <div class="flex gap-2 mb-3">
        <select class="border rounded px-2 py-1 text-sm text-gray-400 flex-1">
          <option>Country</option>
          <option>United States</option>
          <option>Canada</option>
          <option>United Kingdom</option>
        </select>
        <select class="border rounded px-2 py-1 text-sm text-gray-400 flex-1">
          <option>State/Province</option>
          <option>California</option>
          <option>New York</option>
          <option>Texas</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="flex items-center gap-1 text-xs">
          <input type="checkbox" class="w-3 h-3">
          I agree to the terms and conditions
        </label>
      </div>
      <button type="submit" class="bg-blue-500 text-white text-xs px-4 py-1 rounded">Create Account</button>
    </form>
  </div>
</body>
</html>
