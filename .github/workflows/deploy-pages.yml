# Deploy docs/ to GitHub Pages with secrets injected
# The PROXY_URL secret is base64-encoded and replaces __PROXY_ENCODED__ in analyzer.js
# This keeps the actual worker URL out of the git history.
#
# Setup:
#   1. Deploy your Cloudflare Worker (see proxy/README.md)
#   2. Base64-encode the URL: echo -n "https://your-worker.workers.dev" | base64
#   3. Add PROXY_URL as a repository secret (Settings > Secrets > Actions)
#      with the base64-encoded value
#   4. Change Pages build source to "GitHub Actions" in Settings > Pages
#
# If PROXY_URL secret is not set, the analyzer falls back to third-party proxies.

name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject proxy URL
        env:
          PROXY_ENCODED: ${{ secrets.PROXY_URL }}
        run: |
          if [ -n "$PROXY_ENCODED" ]; then
            sed -i "s|__PROXY_ENCODED__|${PROXY_ENCODED}|g" docs/analyzer.js
            echo "Proxy URL injected"
          else
            echo "No PROXY_URL secret set — using third-party proxy fallbacks"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
