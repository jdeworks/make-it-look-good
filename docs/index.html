<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>make-it-look-good — Live Preview</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='12' height='12' rx='2' fill='%232563eb'/><rect x='18' y='2' width='12' height='12' rx='2' fill='%2393c5fd'/><rect x='2' y='18' width='12' height='12' rx='2' fill='%2393c5fd'/><rect x='18' y='18' width='12' height='12' rx='2' fill='%232563eb'/></svg>">
  <link rel="stylesheet" href="style.css?v=3.11.74">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      window._monacoReady = true;
      window.dispatchEvent(new Event('monaco-ready'));
    });
  </script>
</head>
<body>

  <h1 class="sr-only">make-it-look-good — live template preview</h1>

  <!-- Header -->
  <header class="header">
    <!-- Left: logo + templates -->
    <div class="header-left">
      <div class="logo"><span class="logo-full">make-it-look-good <span class="logo-sub">preview</span></span><span class="logo-short">milg</span></div>
      <div class="presets-dropdown">
        <div class="template-btn-group">
          <button class="btn" onclick="togglePresets()" id="presetsBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Templates
          </button>
          <button class="btn btn-icon template-find-btn" onclick="openTemplateChooser()" title="Find a template" aria-label="Find a template">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M11 7v8"/><path d="M7 11h8"/></svg>
          </button>
          <div class="template-nav" id="templateNav" style="display:none;">
            <button class="btn btn-icon btn-nav" onclick="navigateTemplate(-1)" title="Previous template" id="prevTemplateBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="btn btn-icon btn-nav" onclick="navigateTemplate(1)" title="Next template" id="nextTemplateBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>
            </button>
          </div>
          <span class="template-name" id="templateName"></span>
          <button id="restoreTemplateBtn" class="btn btn-icon" onclick="restoreTemplate()" title="Restore original template (discard edits)" aria-label="Restore original template" style="display:none;padding:4px;min-height:auto;margin-left:2px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
        </div>
        <div class="presets-menu" id="presetsMenu" style="max-height:70vh;min-width:min(520px,calc(100vw - 24px));">
          <div class="presets-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="presetSearch" placeholder="Search templates..." autocomplete="off" aria-label="Search templates" />
          </div>
          <div class="presets-list" id="presetsList">
            <div style="padding:12px;color:var(--text-secondary);font-size:13px;">Loading...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Center: viewport buttons (desktop only) -->
    <div class="header-center hide-mobile">
      <div class="viewport-group">
        <button class="btn" onclick="setViewport(320, event)" title="Mobile (320px)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
        </button>
        <button class="btn" onclick="setViewport(768, event)" title="Tablet (768px)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
        </button>
        <button class="btn" onclick="setViewport(1024, event)" title="Desktop (1024px)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </button>
        <button class="btn active" onclick="setViewport('full', event)" title="Full width">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <button class="btn" onclick="toggleFullscreen()" title="Fullscreen preview (Esc to exit)" id="fullscreenBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><polyline points="3 9 3 3 9 3"/><polyline points="21 15 21 21 15 21"/></svg>
        </button>
      </div>
    </div>

    <!-- Right: inspect + dark + share (desktop), dark (mobile) -->
    <div class="header-right">
      <button class="btn btn-icon hide-mobile" onclick="analyzeCurrentPreview()" title="Analyze current preview" id="analyzePreviewBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 3.4 2.1 6.3 5 7.5V20h6v-2.5c2.9-1.2 5-4.1 5-7.5a8 8 0 0 0-8-8z"/><line x1="10" y1="22" x2="14" y2="22"/></svg>
      </button>
      <a href="analyzer.html" class="btn" style="text-decoration:none" title="Open Design Analyzer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        Analyzer
      </a>
      <!-- Contrast checker removed — use the Analyze button or Analyze preview (lightbulb) instead -->
      <button class="btn btn-icon hide-mobile" onclick="toggleInspect()" title="Inspect elements" id="inspectBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 12L3 3"/><path d="M3 3v6h6"/><circle cx="15" cy="15" r="7"/></svg>
      </button>
      <button class="btn btn-icon" onclick="toggleDarkMode()" title="Toggle dark mode" id="darkBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="shareBtn" class="btn hide-mobile" onclick="shareDesign()" title="Copy shareable link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        <span class="share-label">Share</span>
      </button>
      <button id="compareBtn" class="btn hide-mobile" onclick="openComparisonMode()" title="Compare variants">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/><path d="M12 2v20"/></svg>
        Compare
      </button>
      <button id="agentPackBtn" class="btn hide-mobile" onclick="openAgentPackMenu()" title="Agent handoff exports">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6"/><path d="M9 18h4"/></svg>
        Agent Pack
      </button>
    </div>
  </header>

  <!-- Mobile tab bar (hidden on desktop) -->
  <div class="mobile-tabs" id="mobileTabs">
    <button class="mobile-tab" id="mobileTabHtml" onclick="setMobileTab('html')">HTML</button>
    <button class="mobile-tab active" id="mobileTabPreview" onclick="setMobileTab('preview')">Preview</button>
  </div>

  <!-- Shared toolbar above both panels: editor label flows left, preview
       title + controls flow right, so both sides share one height. -->
  <div class="panel-toolbar">
    <span class="panel-toolbar-label">HTML</span>
    <div class="panel-toolbar-sep"></div>
    <div class="panel-toolbar-right">
      <div class="preview-title">
        <span>Preview</span>
        <span id="viewportLabel">Full width</span>
      </div>
      <div class="preview-controls">
        <div id="personalityButtons" style="display:none;align-items:center;gap:3px;"></div>
        <div id="themeSwatches" style="display:none;align-items:center;gap:5px;border-left:1px solid var(--border);padding-left:8px;margin-left:4px;"></div>
        <div id="styleButtons" style="display:none;align-items:center;gap:3px;border-left:1px solid var(--border);padding-left:8px;margin-left:4px;">
          <span style="font-size:9px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.08em;margin-right:2px;">Effect</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="main">
    <!-- Editor -->
    <div class="editor-panel">
      <div id="editorContainer" style="flex:1;overflow:hidden;"></div>
    </div>

    <div class="divider" id="divider"></div>

    <!-- Preview -->
    <div class="preview-panel">
      <!-- Mobile-only collapsible toolbar for personality/theme/effect controls -->
      <div class="mobile-preview-toolbar" id="mobilePreviewToolbar">
        <button class="mobile-toolbar-toggle" id="mobileToolbarToggle" onclick="toggleMobileToolbar()" aria-expanded="false" aria-controls="mobileToolbarContent">
          <svg class="mobile-toolbar-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          <span>Options</span>
        </button>
        <div class="mobile-toolbar-content" id="mobileToolbarContent">
          <div id="mobilePersonalityButtons" class="mobile-toolbar-row"></div>
          <div id="mobileThemeSwatches" class="mobile-toolbar-row"></div>
          <div id="mobileStyleButtons" class="mobile-toolbar-row"></div>
        </div>
      </div>
      <div class="preview-container">
        <iframe id="preview" src="about:blank" sandbox="allow-scripts" title="Design preview"></iframe>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js?v=3.11.74"></script>
</body>
</html>
