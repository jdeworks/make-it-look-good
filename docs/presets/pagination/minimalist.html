<style>
  .pagination-minimalist { background: #ffffff !important; }
  .dark .pagination-minimalist { background: #020617 !important; }
  .pagination-minimalist,
  .pagination-minimalist * {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  /* Lock muted/disabled text to accessible contrast (slate-600 = 5.77:1 on white) */
  .pagination-minimalist .pg-muted { color: #4b5563 !important; }
  .dark .pagination-minimalist .pg-muted { color: #94a3b8 !important; }
  /* Lock active page and interactive button text */
  .pagination-minimalist .pg-active { color: #1e293b !important; border-color: #1e293b !important; }
  .dark .pagination-minimalist .pg-active { color: #ffffff !important; border-color: #ffffff !important; }
  .pagination-minimalist .pg-btn { color: #374151 !important; }
  .dark .pagination-minimalist .pg-btn { color: #e2e8f0 !important; }
</style>
<main class="pagination-minimalist min-h-screen flex items-center justify-center p-8 bg-white dark:bg-slate-950"><div class="w-full max-w-2xl">
<nav class="py-3" aria-label="Pagination">
  <div class="flex items-center justify-between gap-1">
    <!-- Previous -->
    <button disabled class="pg-muted inline-flex items-center justify-center min-h-11 min-w-11 px-2 sm:px-3 py-2 text-xs font-normal text-slate-500 dark:text-slate-400 cursor-not-allowed" aria-label="Previous page">
      <svg class="w-3.5 h-3.5 sm:mr-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      <span class="hidden sm:inline">Previous</span>
    </button>

    <!-- Page numbers (desktop) -->
    <div class="hidden sm:flex items-center gap-0">
      <button class="pg-active min-h-11 min-w-11 px-3 py-2 text-xs font-normal text-slate-800 dark:text-white border-b-2 border-slate-800 dark:border-white focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none" aria-current="page" aria-label="Page 1">1</button>
      <button class="pg-btn min-h-11 min-w-11 px-3 py-2 text-xs font-normal text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border-b-2 border-transparent hover:border-slate-300 dark:hover:border-slate-600 transition-colors focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none" aria-label="Page2">2</button>
      <button class="pg-btn min-h-11 min-w-11 px-3 py-2 text-xs font-normal text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border-b-2 border-transparent hover:border-slate-300 dark:hover:border-slate-600 transition-colors focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none" aria-label="Page3">3</button>
      <button class="pg-btn min-h-11 min-w-11 px-3 py-2 text-xs font-normal text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border-b-2 border-transparent hover:border-slate-300 dark:hover:border-slate-600 transition-colors focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none" aria-label="Page4">4</button>
      <button class="pg-btn min-h-11 min-w-11 px-3 py-2 text-xs font-normal text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border-b-2 border-transparent hover:border-slate-300 dark:hover:border-slate-600 transition-colors focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none" aria-label="Page5">5</button>
      <span class="pg-muted min-h-11 min-w-11 px-3 py-2 text-xs text-slate-500 dark:text-slate-400 flex items-center justify-center" aria-hidden="true">&hellip;</span>
      <button class="pg-btn min-h-11 min-w-11 px-3 py-2 text-xs font-normal text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white border-b-2 border-transparent hover:border-slate-300 dark:hover:border-slate-600 transition-colors focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none" aria-label="Page10">10</button>
    </div>

    <!-- Mobile page indicator -->
    <span class="sm:hidden text-xs font-normal text-slate-700 dark:text-slate-200 px-3">Page 1 of 10</span>

    <!-- Next -->
    <button class="pg-btn inline-flex items-center justify-center min-h-11 min-w-11 px-2 sm:px-3 py-2 text-xs font-normal text-slate-700 dark:text-slate-200 hover:text-slate-900 dark:hover:text-white transition-colors focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:outline-none" aria-label="Next page">
      <span class="hidden sm:inline">Next</span>
      <svg class="w-3.5 h-3.5 sm:ml-1" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</nav>
</div></main>
