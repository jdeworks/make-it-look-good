<!-- Form: Editorial | Inspired by premium brands, magazine subscriptions -->
<!-- Stack: HTML + Tailwind CSS | Dark mode: yes | Responsive: yes -->
<!-- Requires: Playfair Display font (linked below) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap">

<div class="ed-form-shell min-h-screen flex items-center justify-center bg-stone-50 dark:bg-slate-950 text-stone-900 dark:text-slate-50 px-6 py-16 sm:px-8 sm:py-20">
  <main class="w-full max-w-sm sm:max-w-md">

    <!-- Brand mark -->
    <p class="ed-form-kicker text-center text-xs uppercase tracking-[0.3em] text-stone-600 dark:text-slate-400 mb-12">The Chronicle</p>

    <!-- Heading -->
    <h1 class="ed-form-heading font-['Playfair_Display',Georgia,serif] text-center text-4xl font-normal text-stone-900 dark:text-white mb-3">
      Create Account
    </h1>
    <p class="ed-form-muted text-center text-sm text-stone-500 dark:text-slate-400 mb-10">Join our community of readers and writers</p>

    <!-- Divider -->
    <hr class="ed-form-rule border-stone-200 dark:border-slate-800 mb-10">

    <form class="flex flex-col gap-7">
      <!-- Full name -->
      <div>
        <label for="ed-name" class="ed-form-label block text-xs uppercase tracking-wider text-stone-500 dark:text-slate-400 mb-2">Full name</label>
        <input
          id="ed-name"
          type="text"
          autocomplete="name"
          required
          class="ed-form-input w-full bg-transparent border-0 border-b border-stone-300 dark:border-slate-700 focus:border-indigo-600 dark:focus:border-indigo-400 outline-none pb-2.5 text-base text-stone-900 dark:text-white placeholder-stone-300 dark:placeholder-slate-600 transition-colors min-h-11 rounded-px focus-visible:ring-2 focus-visible:ring-indigo-600/25 dark:focus-visible:ring-indigo-300/30"
          placeholder="Jane Smith"
        >
      </div>

      <!-- Email -->
      <div>
        <label for="ed-email" class="ed-form-label block text-xs uppercase tracking-wider text-stone-500 dark:text-slate-400 mb-2">Email address</label>
        <input
          id="ed-email"
          type="email"
          autocomplete="email"
          required
          class="ed-form-input w-full bg-transparent border-0 border-b border-stone-300 dark:border-slate-700 focus:border-indigo-600 dark:focus:border-indigo-400 outline-none pb-2.5 text-base text-stone-900 dark:text-white placeholder-stone-300 dark:placeholder-slate-600 transition-colors min-h-11 rounded-px focus-visible:ring-2 focus-visible:ring-indigo-600/25 dark:focus-visible:ring-indigo-300/30"
          placeholder="jane@example.com"
        >
      </div>

      <!-- Divider -->
      <hr class="ed-form-rule border-stone-200 dark:border-slate-800 my-1">

      <!-- Password -->
      <div>
        <label for="ed-password" class="ed-form-label block text-xs uppercase tracking-wider text-stone-500 dark:text-slate-400 mb-2">Password</label>
        <input
          id="ed-password"
          type="password"
          autocomplete="new-password"
          required
          class="ed-form-input w-full bg-transparent border-0 border-b border-stone-300 dark:border-slate-700 focus:border-indigo-600 dark:focus:border-indigo-400 outline-none pb-2.5 text-base text-stone-900 dark:text-white transition-colors min-h-11 rounded-px focus-visible:ring-2 focus-visible:ring-indigo-600/25 dark:focus-visible:ring-indigo-300/30"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
        >
      </div>

      <!-- Confirm password -->
      <div>
        <label for="ed-confirm" class="ed-form-label block text-xs uppercase tracking-wider text-stone-500 dark:text-slate-400 mb-2">Confirm password</label>
        <input
          id="ed-confirm"
          type="password"
          autocomplete="new-password"
          required
          class="ed-form-input w-full bg-transparent border-0 border-b border-stone-300 dark:border-slate-700 focus:border-indigo-600 dark:focus:border-indigo-400 outline-none pb-2.5 text-base text-stone-900 dark:text-white transition-colors min-h-11 rounded-px focus-visible:ring-2 focus-visible:ring-indigo-600/25 dark:focus-visible:ring-indigo-300/30"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
        >
      </div>

      <!-- Divider -->
      <hr class="ed-form-rule border-stone-200 dark:border-slate-800 my-1">

      <!-- Terms -->
      <label class="flex items-start gap-3 cursor-pointer min-h-11">
        <input type="checkbox" required class="mt-0.5 w-4 h-4 accent-indigo-600 dark:accent-indigo-400">
        <span class="ed-form-muted text-sm text-stone-500 dark:text-slate-400 leading-relaxed">I agree to the <a href="#" class="ed-form-link text-indigo-600 dark:text-indigo-400 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 rounded">terms&nbsp;and&nbsp;conditions</a></span>
      </label>

      <!-- Submit -->
      <button
        type="submit"
        class="ed-form-button w-full h-14 bg-slate-700 dark:bg-slate-200 text-white dark:text-slate-900 text-sm uppercase tracking-[0.15em] font-normal rounded-sm hover:bg-slate-800 dark:hover:bg-white transition-colors min-h-11 mt-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      >
        Create Account
      </button>
    </form>

    <!-- Sign in link -->
    <p class="ed-form-muted text-center mt-10 text-sm text-stone-500 dark:text-slate-400">
      Already have an account?
      <a href="#" class="ed-form-link text-indigo-600 dark:text-indigo-400 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 rounded">Sign in</a>
    </p>

  </main>
</div>
