<!-- Form: Clean | Compact account form, standard Tailwind, high-contrast neutral shell -->
<!-- Stack: HTML + Tailwind CSS | Dark mode: yes | Responsive: yes -->

<div id="formWrap" class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 px-5 py-10 sm:px-6 sm:py-14">
  <main class="w-full max-w-md" aria-labelledby="form-title">
    <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm px-6 py-8 sm:px-8 sm:py-10">
      <header class="text-center mb-8 sm:mb-10">
        <p class="text-xs font-semibold tracking-[0.18em] uppercase text-slate-700 dark:text-slate-200 mb-3">Acme Access</p>
        <h1 id="form-title" class="text-3xl font-semibold text-slate-950 dark:text-white tracking-tight mb-3">Create account</h1>
        <p id="form-description" class="text-sm leading-6 text-slate-700 dark:text-slate-300">Set up your workspace profile.</p>
      </header>

      <form class="flex flex-col gap-6" aria-labelledby="form-title" aria-describedby="form-description">
        <!-- Name -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label for="form-first-name" class="block text-sm font-medium text-slate-800 dark:text-slate-200 mb-2">First name</label>
            <input id="form-first-name" name="first-name" type="text" autocomplete="given-name" required class="w-full min-h-11 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950 px-4 py-3 text-base text-slate-950 dark:text-white placeholder:text-slate-600 dark:placeholder:text-slate-300 outline-none transition-colors focus:border-slate-950 dark:focus:border-white focus:ring-2 focus:ring-blue-600/25 dark:focus:ring-blue-400/30" placeholder="Jane">
          </div>
          <div>
            <label for="form-last-name" class="block text-sm font-medium text-slate-800 dark:text-slate-200 mb-2">Last name</label>
            <input id="form-last-name" name="last-name" type="text" autocomplete="family-name" required class="w-full min-h-11 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950 px-4 py-3 text-base text-slate-950 dark:text-white placeholder:text-slate-600 dark:placeholder:text-slate-300 outline-none transition-colors focus:border-slate-950 dark:focus:border-white focus:ring-2 focus:ring-blue-600/25 dark:focus:ring-blue-400/30" placeholder="Smith">
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="form-email" class="block text-sm font-medium text-slate-800 dark:text-slate-200 mb-2">Email address</label>
          <input id="form-email" name="email" type="email" autocomplete="email" required class="w-full min-h-11 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950 px-4 py-3 text-base text-slate-950 dark:text-white placeholder:text-slate-600 dark:placeholder:text-slate-300 outline-none transition-colors focus:border-slate-950 dark:focus:border-white focus:ring-2 focus:ring-blue-600/25 dark:focus:ring-blue-400/30" placeholder="jane@example.com">
        </div>

        <!-- Phone -->
        <div>
          <label for="form-phone" class="block text-sm font-medium text-slate-800 dark:text-slate-200 mb-2">Phone</label>
          <input id="form-phone" name="phone" type="tel" autocomplete="tel" class="w-full min-h-11 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950 px-4 py-3 text-base text-slate-950 dark:text-white placeholder:text-slate-600 dark:placeholder:text-slate-300 outline-none transition-colors focus:border-slate-950 dark:focus:border-white focus:ring-2 focus:ring-blue-600/25 dark:focus:ring-blue-400/30" placeholder="+1 (555) 000-0000">
        </div>

        <!-- Password -->
        <div>
          <label for="form-password" class="block text-sm font-medium text-slate-800 dark:text-slate-200 mb-2">Password</label>
          <input id="form-password" name="password" type="password" autocomplete="new-password" required class="w-full min-h-11 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950 px-4 py-3 text-base text-slate-950 dark:text-white placeholder:text-slate-600 dark:placeholder:text-slate-300 outline-none transition-colors focus:border-slate-950 dark:focus:border-white focus:ring-2 focus:ring-blue-600/25 dark:focus:ring-blue-400/30" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </div>

        <!-- Company -->
        <div>
          <label for="form-company" class="block text-sm font-medium text-slate-800 dark:text-slate-200 mb-2">Company <span class="font-normal text-slate-600 dark:text-slate-300">(optional)</span></label>
          <input id="form-company" name="company" type="text" autocomplete="organization" class="w-full min-h-11 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-950 px-4 py-3 text-base text-slate-950 dark:text-white placeholder:text-slate-600 dark:placeholder:text-slate-300 outline-none transition-colors focus:border-slate-950 dark:focus:border-white focus:ring-2 focus:ring-blue-600/25 dark:focus:ring-blue-400/30" placeholder="Acme Inc.">
        </div>

        <!-- Terms -->
        <label class="flex items-start gap-3 cursor-pointer min-h-11">
          <input id="form-terms" name="terms" type="checkbox" required class="mt-1 h-4 w-4 accent-slate-950 dark:accent-white">
          <span class="text-sm leading-6 text-slate-700 dark:text-slate-300">I agree to the <a href="#" class="font-medium text-slate-950 dark:text-white underline underline-offset-4 hover:text-slate-700 dark:hover:text-slate-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400 rounded">terms and conditions</a></span>
        </label>

        <!-- Submit -->
        <button type="submit" class="w-full h-14 min-h-11 rounded-lg bg-slate-950 dark:bg-white text-base font-medium text-white dark:text-slate-950 hover:bg-slate-800 dark:hover:bg-slate-100 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">Create Account</button>
      </form>
    </section>

    <!-- Helper link -->
    <p class="text-center mt-7 text-sm text-slate-700 dark:text-slate-300">
      Already have an account?
      <a href="#" class="font-medium text-slate-950 dark:text-white underline underline-offset-4 hover:text-slate-700 dark:hover:text-slate-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400 rounded">Sign in</a>
    </p>
  </main>
</div>
