<!-- Form: Ultra-Minimalist | Inspired by Apple ID, Typeform, Muji -->
<!-- Stack: HTML + Tailwind CSS | Dark mode: yes | Responsive: yes -->
<div class="min-h-screen flex items-center justify-center bg-white dark:bg-slate-950 px-6 py-12">
  <main class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-12">
      <span class="text-sm font-light tracking-[0.2em] uppercase text-slate-500 dark:text-slate-400">Create Account</span>
    </div>

    <!-- Heading -->
    <h1 class="text-2xl font-light text-center text-slate-900 dark:text-white mb-2 tracking-tight">Join us</h1>
    <p class="text-sm text-center text-slate-500 dark:text-slate-400 mb-12">Enter your details to get started</p>

    <form class="flex flex-col gap-8">
      <!-- First name -->
      <div>
        <label for="form-first-name" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">First name</label>
        <input id="form-first-name" type="text" autocomplete="given-name" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="Jane">
      </div>

      <!-- Last name -->
      <div>
        <label for="form-last-name" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Last name</label>
        <input id="form-last-name" type="text" autocomplete="family-name" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="Smith">
      </div>

      <!-- Email -->
      <div>
        <label for="form-email" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Email address</label>
        <input id="form-email" type="email" autocomplete="email" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="jane@example.com">
      </div>

      <!-- Phone -->
      <div>
        <label for="form-phone" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Phone</label>
        <input id="form-phone" type="tel" autocomplete="tel" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="+1 (555) 000-0000">
      </div>

      <!-- Password -->
      <div>
        <label for="form-password" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Password</label>
        <input id="form-password" type="password" autocomplete="new-password" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white transition-colors min-h-11" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>

      <!-- Confirm password -->
      <div>
        <label for="form-confirm-password" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Confirm password</label>
        <input id="form-confirm-password" type="password" autocomplete="new-password" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white transition-colors min-h-11" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>

      <!-- Company -->
      <div>
        <label for="form-company" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Company <span class="normal-case tracking-normal">(optional)</span></label>
        <input id="form-company" type="text" autocomplete="organization" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="Acme Inc.">
      </div>

      <!-- Address -->
      <div>
        <label for="form-address" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Address</label>
        <input id="form-address" type="text" autocomplete="street-address" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="123 Main St">
      </div>

      <!-- City & ZIP -->
      <div class="grid grid-cols-2 gap-6">
        <div>
          <label for="form-city" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">City</label>
          <input id="form-city" type="text" autocomplete="address-level2" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="San Francisco">
        </div>
        <div>
          <label for="form-zip" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">ZIP</label>
          <input id="form-zip" type="text" autocomplete="postal-code" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 transition-colors min-h-11" placeholder="94102">
        </div>
      </div>

      <!-- Country & State -->
      <div class="grid grid-cols-2 gap-6">
        <div>
          <label for="form-country" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">Country</label>
          <select id="form-country" autocomplete="country" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white transition-colors min-h-11">
            <option value="" class="text-slate-400">Select</option>
            <option>United States</option>
            <option>Canada</option>
            <option>United Kingdom</option>
          </select>
        </div>
        <div>
          <label for="form-state" class="block text-xs uppercase tracking-[0.15em] text-slate-500 dark:text-slate-400 mb-2">State</label>
          <select id="form-state" autocomplete="address-level1" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-700 focus:border-blue-600 dark:focus:border-blue-400 outline-none pb-2 text-base text-slate-900 dark:text-white transition-colors min-h-11">
            <option value="" class="text-slate-400">Select</option>
            <option>California</option>
            <option>New York</option>
            <option>Texas</option>
          </select>
        </div>
      </div>

      <!-- Terms -->
      <label class="flex items-start gap-3 cursor-pointer min-h-11">
        <input type="checkbox" class="mt-1 w-4 h-4 accent-blue-600">
        <span class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">I agree to the <a href="#" class="text-blue-600 dark:text-blue-400 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 rounded">terms and conditions</a></span>
      </label>

      <!-- Submit -->
      <button type="submit" class="w-full h-14 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-base font-medium rounded-lg hover:bg-slate-800 dark:hover:bg-slate-100 transition-colors mt-4 min-h-11 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">Create Account</button>
    </form>

    <!-- Helper links -->
    <div class="text-center mt-8">
      <p class="text-sm text-slate-500 dark:text-slate-400">Already have an account? <a href="#" class="text-blue-600 dark:text-blue-400 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 rounded">Sign in</a></p>
    </div>
  </main>
</div>
