<!-- Form: Playful | Inspired by Duolingo, fun sign-up flows -->
<!-- Stack: HTML + Tailwind CSS | Dark mode: yes | Responsive: yes -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-rose-50 via-white to-violet-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 px-4 py-12">
  <main class="w-full max-w-md">

    <!-- Card -->
    <div class="relative bg-white dark:bg-slate-800 rounded-2xl shadow-[0_12px_40px_-8px_rgba(244,63,94,0.18),0_8px_24px_-4px_rgba(99,102,241,0.12)] dark:shadow-[0_12px_40px_-8px_rgba(244,63,94,0.12),0_8px_24px_-4px_rgba(99,102,241,0.08)] overflow-hidden">

      <!-- Gradient accent bar -->
      <div class="h-2 bg-gradient-to-r from-rose-500 via-pink-500 to-indigo-500"></div>

      <div class="px-8 pt-8 pb-10 sm:px-10">

        <!-- Heading -->
        <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white text-center">Let's get you started!</h1>
        <p class="text-base text-slate-500 dark:text-slate-400 text-center mt-2 mb-8">Create your account in seconds &#x1F680;</p>

        <form class="flex flex-col gap-5">
          <!-- Full name -->
          <div>
            <label for="play-name" class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-1.5">Full name</label>
            <input
              id="play-name"
              type="text"
              autocomplete="name"
              required
              class="w-full bg-rose-50/50 dark:bg-slate-700/50 border-2 border-rose-200 dark:border-slate-600 rounded-xl px-4 py-3 text-base text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-rose-400 dark:focus:ring-rose-500 dark:focus:border-rose-500 transition-all min-h-11"
              placeholder="Jane Smith"
            >
          </div>

          <!-- Email -->
          <div>
            <label for="play-email" class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-1.5">Email address</label>
            <input
              id="play-email"
              type="email"
              autocomplete="email"
              required
              class="w-full bg-rose-50/50 dark:bg-slate-700/50 border-2 border-rose-200 dark:border-slate-600 rounded-xl px-4 py-3 text-base text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-rose-400 dark:focus:ring-rose-500 dark:focus:border-rose-500 transition-all min-h-11"
              placeholder="jane@example.com"
            >
          </div>

          <!-- Password -->
          <div>
            <label for="play-password" class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-1.5">Password</label>
            <input
              id="play-password"
              type="password"
              autocomplete="new-password"
              required
              class="w-full bg-rose-50/50 dark:bg-slate-700/50 border-2 border-rose-200 dark:border-slate-600 rounded-xl px-4 py-3 text-base text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-rose-400 dark:focus:ring-rose-500 dark:focus:border-rose-500 transition-all min-h-11"
              placeholder="Make it a good one!"
            >
          </div>

          <!-- Terms -->
          <label class="flex items-start gap-3 cursor-pointer min-h-11 mt-1">
            <input type="checkbox" required class="mt-1 w-5 h-5 accent-rose-500 rounded">
            <span class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">I agree to the <a href="#" class="text-rose-600 dark:text-rose-400 font-bold hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-500 rounded">terms&nbsp;and&nbsp;conditions</a></span>
          </label>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full py-4 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 dark:from-rose-500 dark:to-pink-500 dark:hover:from-rose-600 dark:hover:to-pink-600 text-white text-base font-extrabold rounded-full transition-all hover:scale-[1.02] active:scale-[0.98] min-h-11 shadow-[0_6px_20px_-4px_rgba(244,63,94,0.4)] hover:shadow-[0_8px_28px_-4px_rgba(244,63,94,0.5)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-600 mt-2"
          >
            Create Account
          </button>
        </form>

        <!-- Sign in link -->
        <p class="text-center mt-6 text-sm text-slate-500 dark:text-slate-400">
          Already have an account?
          <a href="#" class="text-rose-600 dark:text-rose-400 font-bold hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-500 rounded">Sign in</a>
        </p>

      </div>
    </div>

  </main>
</div>
