<!-- Form: Minimalist | Swiss/editorial feel, bottom-border inputs, monochrome -->
<!-- Stack: HTML + Tailwind CSS | Dark mode: yes | Responsive: yes -->
<style>
  .form-minimalist,
  .form-minimalist * {
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }

  .form-minimalist :is(input, button, a) {
    min-height: 44px;
  }

  .form-minimalist input::placeholder {
    color: rgb(30 41 59);
    opacity: 1;
  }

  .dark .form-minimalist input::placeholder {
    color: rgb(226 232 240);
  }

  @media (min-width: 640px) {
    .form-minimalist .form-shell {
      max-width: 28rem;
    }
  }
</style>
<div class="form-minimalist min-h-screen flex items-center justify-center bg-white dark:bg-slate-950 px-5 py-10 sm:px-6 sm:py-12">
  <main class="w-full max-w-sm" aria-labelledby="min-title">

    <!-- Logo text -->
    <div class="text-center mb-12 sm:mb-16">
      <span class="text-sm font-normal tracking-[0.24em] uppercase text-slate-800 dark:text-slate-200">Acme</span>
    </div>

    <!-- Heading -->
    <h1 id="min-title" class="text-3xl font-normal text-center text-slate-900 dark:text-white mb-3 tracking-tight">Create Account</h1>
    <p id="min-description" class="text-sm text-center text-slate-800 dark:text-slate-200 mb-10 sm:mb-14 font-normal">Enter your details to get started</p>

    <form class="form-shell flex flex-col gap-8 sm:gap-10" aria-labelledby="min-title" aria-describedby="min-description">
      <!-- Full name -->
      <div>
        <label for="min-name" class="block text-sm uppercase tracking-[0.16em] text-slate-800 dark:text-slate-200 mb-3 font-normal">Full name</label>
        <input
          id="min-name"
          name="name"
          type="text"
          autocomplete="name"
          required
          class="w-full bg-transparent border-0 border-b border-slate-400 dark:border-slate-500 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-normal text-slate-900 dark:text-white placeholder-slate-800 dark:placeholder-slate-200 transition-colors min-h-11"
          placeholder="Jane Smith"
        >
      </div>

      <!-- Email -->
      <div>
        <label for="min-email" class="block text-sm uppercase tracking-[0.16em] text-slate-800 dark:text-slate-200 mb-3 font-normal">Email</label>
        <input
          id="min-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="w-full bg-transparent border-0 border-b border-slate-400 dark:border-slate-500 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-normal text-slate-900 dark:text-white placeholder-slate-800 dark:placeholder-slate-200 transition-colors min-h-11"
          placeholder="jane@example.com"
        >
      </div>

      <!-- Password -->
      <div>
        <label for="min-password" class="block text-sm uppercase tracking-[0.16em] text-slate-800 dark:text-slate-200 mb-3 font-normal">Password</label>
        <input
          id="min-password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          class="w-full bg-transparent border-0 border-b border-slate-400 dark:border-slate-500 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-normal text-slate-900 dark:text-white placeholder-slate-800 dark:placeholder-slate-200 transition-colors min-h-11"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
        >
      </div>

      <!-- Confirm password -->
      <div>
        <label for="min-confirm" class="block text-sm uppercase tracking-[0.16em] text-slate-800 dark:text-slate-200 mb-3 font-normal">Confirm password</label>
        <input
          id="min-confirm"
          name="confirm-password"
          type="password"
          autocomplete="new-password"
          required
          class="w-full bg-transparent border-0 border-b border-slate-400 dark:border-slate-500 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-normal text-slate-900 dark:text-white placeholder-slate-800 dark:placeholder-slate-200 transition-colors min-h-11"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
        >
      </div>

      <!-- Terms -->
      <label class="flex items-start gap-3 cursor-pointer min-h-11 mt-2">
        <input id="min-terms" name="terms" type="checkbox" required class="mt-0.5 w-4 h-4 accent-slate-900 dark:accent-white">
        <span class="text-sm text-slate-800 dark:text-slate-200 leading-relaxed font-normal">I agree to the <a href="#" class="text-slate-900 dark:text-white hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 dark:focus-visible:outline-white rounded">terms&nbsp;and&nbsp;conditions</a></span>
      </label>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full h-14 border border-slate-900 dark:border-white bg-transparent text-slate-900 dark:text-white text-sm font-normal tracking-[0.15em] uppercase hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors min-h-11 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 dark:focus-visible:outline-white"
      >
        Create Account
      </button>
    </form>

    <!-- Sign in link -->
    <p class="text-center mt-12 text-sm text-slate-800 dark:text-slate-200 font-normal">
      Already have an account?
      <a href="#" class="text-slate-900 dark:text-white hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 dark:focus-visible:outline-white rounded">Sign in</a>
    </p>

  </main>
</div>
