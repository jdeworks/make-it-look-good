<!-- Form: Minimalist | Swiss/editorial feel, bottom-border inputs, monochrome -->
<!-- Stack: HTML + Tailwind CSS | Dark mode: yes | Responsive: yes -->
<div class="min-h-screen flex items-center justify-center bg-white dark:bg-slate-950 px-5 py-10 sm:px-6 sm:py-12">
  <main class="w-full max-w-sm" aria-labelledby="min-title">

    <!-- Logo text -->
    <div class="text-center mb-12 sm:mb-16">
      <span class="text-xs font-light tracking-[0.3em] uppercase text-slate-600 dark:text-slate-300">Acme</span>
    </div>

    <!-- Heading -->
    <h1 id="min-title" class="text-3xl font-light text-center text-slate-900 dark:text-white mb-3 tracking-tight">Create Account</h1>
    <p id="min-description" class="text-sm text-center text-slate-600 dark:text-slate-300 mb-10 sm:mb-14 font-light">Enter your details to get started</p>

    <form class="flex flex-col gap-8 sm:gap-10" aria-labelledby="min-title" aria-describedby="min-description">
      <!-- Full name -->
      <div>
        <label for="min-name" class="block text-xs uppercase tracking-[0.2em] text-slate-600 dark:text-slate-300 mb-3 font-light">Full name</label>
        <input
          id="min-name"
          name="name"
          type="text"
          autocomplete="name"
          required
          class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-light text-slate-900 dark:text-white placeholder-slate-600 dark:placeholder-slate-300 transition-colors min-h-11"
          placeholder="Jane Smith"
        >
      </div>

      <!-- Email -->
      <div>
        <label for="min-email" class="block text-xs uppercase tracking-[0.2em] text-slate-600 dark:text-slate-300 mb-3 font-light">Email</label>
        <input
          id="min-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-light text-slate-900 dark:text-white placeholder-slate-600 dark:placeholder-slate-300 transition-colors min-h-11"
          placeholder="jane@example.com"
        >
      </div>

      <!-- Password -->
      <div>
        <label for="min-password" class="block text-xs uppercase tracking-[0.2em] text-slate-600 dark:text-slate-300 mb-3 font-light">Password</label>
        <input
          id="min-password"
          name="password"
          type="password"
          autocomplete="new-password"
          required
          class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-light text-slate-900 dark:text-white placeholder-slate-600 dark:placeholder-slate-300 transition-colors min-h-11"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
        >
      </div>

      <!-- Confirm password -->
      <div>
        <label for="min-confirm" class="block text-xs uppercase tracking-[0.2em] text-slate-600 dark:text-slate-300 mb-3 font-light">Confirm password</label>
        <input
          id="min-confirm"
          name="confirm-password"
          type="password"
          autocomplete="new-password"
          required
          class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-slate-900 dark:focus:border-white outline-none pb-2 text-base font-light text-slate-900 dark:text-white placeholder-slate-600 dark:placeholder-slate-300 transition-colors min-h-11"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
        >
      </div>

      <!-- Terms -->
      <label class="flex items-start gap-3 cursor-pointer min-h-11 mt-2">
        <input id="min-terms" name="terms" type="checkbox" required class="mt-0.5 w-4 h-4 accent-slate-900 dark:accent-white">
        <span class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed font-light">I agree to the <a href="#" class="text-slate-900 dark:text-white hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 dark:focus-visible:outline-white rounded">terms&nbsp;and&nbsp;conditions</a></span>
      </label>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full h-14 border border-slate-900 dark:border-white bg-transparent text-slate-900 dark:text-white text-sm font-light tracking-[0.15em] uppercase hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 transition-colors min-h-11 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 dark:focus-visible:outline-white"
      >
        Create Account
      </button>
    </form>

    <!-- Sign in link -->
    <p class="text-center mt-12 text-sm text-slate-600 dark:text-slate-300 font-light">
      Already have an account?
      <a href="#" class="text-slate-900 dark:text-white hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-900 dark:focus-visible:outline-white rounded">Sign in</a>
    </p>

  </main>
</div>
