<style>
  .shell-minimalist { background: #ffffff; color: #0f172a; }
  .shell-minimalist-surface { background: #ffffff; }
  .shell-minimalist-rule { border-color: #cbd5e1; }
  .shell-minimalist-soft-rule { border-color: #e2e8f0; }
  .shell-minimalist-heading,
  .shell-minimalist-active { color: #0f172a; letter-spacing: 0; }
  .shell-minimalist-muted,
  .shell-minimalist-link,
  .shell-minimalist-icon { color: #334155; }
  .shell-minimalist-subtle { color: #475569; }
  .shell-minimalist-link:hover { color: #0f172a; }
  .shell-minimalist-input { color: #0f172a; border-color: #94a3b8; min-height: 44px; line-height: 1.5; }
  .shell-minimalist-input::placeholder { color: #475569; }
  .dark .shell-minimalist { background: #020617; color: #f8fafc; }
  .dark .shell-minimalist-surface { background: #020617; }
  .dark .shell-minimalist-rule { border-color: #334155; }
  .dark .shell-minimalist-soft-rule { border-color: #1e293b; }
  .dark .shell-minimalist-heading,
  .dark .shell-minimalist-active { color: #f8fafc; }
  .dark .shell-minimalist-muted,
  .dark .shell-minimalist-link,
  .dark .shell-minimalist-icon { color: #cbd5e1; }
  .dark .shell-minimalist-subtle { color: #e2e8f0; }
  .dark .shell-minimalist-link:hover { color: #ffffff; }
  .dark .shell-minimalist-input { color: #f8fafc; border-color: #475569; }
  .dark .shell-minimalist-input::placeholder { color: #cbd5e1; }
</style>
<div class="shell-minimalist min-h-screen">

  <!-- Sidebar -->
  <aside class="shell-minimalist-surface shell-minimalist-rule fixed inset-y-0 left-0 w-56 border-r flex flex-col z-30 transition-transform duration-200 -translate-x-full lg:translate-x-0" id="sidebar">
    <!-- Logo -->
    <div class="h-16 flex items-center px-6">
      <span class="shell-minimalist-heading text-xs font-normal uppercase">AppName</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-6 py-4 space-y-0" aria-label="Main navigation">
      <a href="#" class="shell-minimalist-active shell-minimalist-soft-rule block min-h-11 py-2.5 text-sm border-b font-normal" aria-current="page">
        Dashboard
      </a>
      <a href="#" class="shell-minimalist-link shell-minimalist-soft-rule block min-h-11 py-2.5 text-sm transition-colors border-b font-normal">
        Users
      </a>
      <a href="#" class="shell-minimalist-link shell-minimalist-soft-rule block min-h-11 py-2.5 text-sm transition-colors border-b font-normal">
        Products
      </a>
      <a href="#" class="shell-minimalist-link shell-minimalist-soft-rule block min-h-11 py-2.5 text-sm transition-colors border-b font-normal">
        Orders
      </a>
      <a href="#" class="shell-minimalist-link block min-h-11 py-2.5 text-sm transition-colors font-normal">
        Reports
      </a>
    </nav>

    <!-- Sidebar footer -->
    <div class="shell-minimalist-rule px-6 py-4 border-t">
      <a href="#" class="shell-minimalist-link block min-h-11 py-2.5 text-sm transition-colors font-normal">
        Settings
      </a>
    </div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="fixed inset-0 bg-slate-900/20 z-20 lg:hidden hidden" id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.add('-translate-x-full');this.classList.add('hidden')"></div>

  <!-- Main wrapper -->
  <div class="lg:ml-56 flex flex-col min-h-screen">

    <!-- Top bar -->
    <header class="shell-minimalist-surface shell-minimalist-rule h-16 border-b flex items-center justify-between px-4 lg:px-12 sticky top-0 z-10">
      <!-- Mobile menu button -->
      <button class="shell-minimalist-link lg:hidden p-2 -ml-2 min-h-11 min-w-11 focus-visible:ring-2 focus-visible:ring-slate-500 focus-visible:outline-none" onclick="document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebar-overlay').classList.remove('hidden')" aria-label="Open menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <!-- Search -->
      <div class="hidden sm:flex items-center flex-1 max-w-md">
        <div class="relative w-full">
          <svg class="shell-minimalist-icon absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" autocomplete="off" aria-label="Search" placeholder="Search..." class="shell-minimalist-input w-full pl-6 pr-4 py-2 text-sm font-normal bg-transparent border-0 border-b focus:border-slate-900 dark:focus:border-white outline-none transition-colors min-h-11">
        </div>
      </div>

      <!-- Right side -->
      <div class="flex items-center gap-2">
        <div class="shell-minimalist-rule shell-minimalist-muted w-8 h-8 border rounded-full flex items-center justify-center text-sm font-normal">J</div>
      </div>
    </header>

    <!-- Content area -->
    <main class="flex-1 p-6 lg:p-16 max-w-7xl w-full mx-auto">
      <div class="max-w-3xl">
        <h1 class="shell-minimalist-heading text-3xl font-normal mb-2">Page Title</h1>
        <p class="shell-minimalist-muted text-sm mb-12 font-normal">Page description goes here.</p>

        <div>
          <p class="shell-minimalist-muted font-normal text-sm leading-relaxed max-w-2xl">Replace this with your page content. The shell provides sidebar navigation, search, and a focused content area.</p>
        </div>
      </div>
    </main>
  </div>
</div>
