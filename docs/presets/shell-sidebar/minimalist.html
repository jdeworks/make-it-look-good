<div class="min-h-screen bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-50">

  <!-- Sidebar -->

    <!-- Logo -->
    <div class="h-16 flex items-center px-6">
      <span class="text-slate-900 dark:text-slate-50 text-xs font-normal uppercase">AppName</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-6 py-4 space-y-0" aria-label="Main navigation">

        Dashboard

      <a href="#" class="text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800 block min-h-11 py-2.5 text-sm transition-colors border-b font-normal hover:text-slate-900 dark:hover:text-white">
        Users

      <a href="#" class="text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800 block min-h-11 py-2.5 text-sm transition-colors border-b font-normal hover:text-slate-900 dark:hover:text-white">
        Products
      </a>
      <a href="#" class="text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-800 block min-h-11 py-2.5 text-sm transition-colors border-b font-normal hover:text-slate-900 dark:hover:text-white">
        Orders
      </a>
      <a href="#" class="text-slate-700 dark:text-slate-300 block min-h-11 py-2.5 text-sm transition-colors font-normal hover:text-slate-900 dark:hover:text-white">
        Reports
      </a>
    </nav>

    <!-- Sidebar footer -->
    <div class="border-slate-300 dark:border-slate-700 px-6 py-4 border-t">

        Settings
      </a>
    </div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="fixed inset-0 bg-slate-900/20 z-20 lg:hidden hidden" id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.add('-translate-x-full');this.classList.add('hidden')"></div>

  <!-- Main wrapper -->
  <div class="lg:ml-56 flex flex-col min-h-screen">

    <!-- Top bar -->
    <header class="bg-white dark:bg-slate-950 border-slate-300 dark:border-slate-700 h-16 border-b flex items-center justify-between px-4 lg:px-12 sticky top-0 z-10">
      <!-- Mobile menu button -->
      <button class="text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white lg:hidden p-2 -ml-2 min-h-11 min-w-11 focus-visible:ring-2 focus-visible:ring-slate-500 focus-visible:outline-none" onclick="document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebar-overlay').classList.remove('hidden')" aria-label="Open menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <!-- Search -->
      <div class="hidden sm:flex items-center flex-1 max-w-md">
        <div class="relative w-full">
          <svg class="text-slate-700 dark:text-slate-300 absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" autocomplete="off" aria-label="Search" placeholder="Search..." class="text-slate-900 dark:text-slate-50 border-slate-400 dark:border-slate-600 placeholder:text-slate-700 dark:placeholder:text-slate-300 w-full pl-6 pr-4 py-2 text-sm font-normal bg-transparent border-0 border-b focus:border-slate-900 dark:focus:border-white outline-none transition-colors min-h-11 leading-normal">
        </div>
      </div>

      <!-- Right side -->
      <div class="flex items-center gap-2">
        <div class="border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 w-8 h-8 border rounded-full flex items-center justify-center text-sm font-normal">J</div>
      </div>
    </header>

    <!-- Content area -->
    <main class="flex-1 p-6 lg:p-16 max-w-7xl w-full mx-auto">
      <div class="max-w-3xl">
        <h1 class="text-slate-900 dark:text-slate-50 text-3xl font-normal mb-2">Page Title</h1>
        <p class="text-slate-700 dark:text-slate-300 text-sm mb-12 font-normal">Page description goes here.</p>

        <div>
          <p class="text-slate-700 dark:text-slate-300 font-normal text-sm leading-relaxed max-w-2xl">Replace this with your page content. The shell provides sidebar navigation, search, and a focused content area.</p>
        </div>
      </div>
    </main>
