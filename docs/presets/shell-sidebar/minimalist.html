<div class="min-h-screen bg-white dark:bg-slate-950">

  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 w-60 border-r border-slate-200 dark:border-slate-800 flex flex-col z-30 transition-transform duration-200 -translate-x-full lg:translate-x-0" id="sidebar">
    <!-- Logo -->
    <div class="h-16 flex items-center px-6">
      <span class="text-base font-light text-slate-900 dark:text-white tracking-wide">AppName</span>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto px-6 py-4 space-y-1" aria-label="Main navigation">
      <a href="#" class="block min-h-11 py-2.5 text-sm font-normal text-slate-900 dark:text-white" aria-current="page">
        Dashboard
      </a>
      <a href="#" class="block min-h-11 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
        Users
      </a>
      <a href="#" class="block min-h-11 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
        Products
      </a>
      <a href="#" class="block min-h-11 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
        Orders
      </a>
      <a href="#" class="block min-h-11 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
        Reports
      </a>
    </nav>

    <!-- Sidebar footer -->
    <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800">
      <a href="#" class="block min-h-11 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
        Settings
      </a>
    </div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="fixed inset-0 bg-slate-900/30 z-20 lg:hidden hidden" id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.add('-translate-x-full');this.classList.add('hidden')"></div>

  <!-- Main wrapper -->
  <div class="lg:ml-60 flex flex-col min-h-screen">

    <!-- Top bar -->
    <header class="h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 lg:px-12 sticky top-0 z-10 bg-white dark:bg-slate-950">
      <!-- Mobile menu button -->
      <button class="lg:hidden p-2 -ml-2 text-slate-500 hover:text-slate-900 dark:hover:text-white min-h-11 min-w-11 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none" onclick="document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('sidebar-overlay').classList.remove('hidden')" aria-label="Open menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <!-- Search -->
      <div class="hidden sm:flex items-center flex-1 max-w-md">
        <div class="relative w-full">
          <svg class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300 dark:text-slate-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" autocomplete="off" aria-label="Search" placeholder="Search..." class="w-full pl-6 pr-4 py-2 text-sm bg-transparent border-0 border-b border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 focus:border-slate-900 dark:focus:border-white outline-none transition-colors min-h-11">
        </div>
      </div>

      <!-- Right side -->
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 border border-slate-200 dark:border-slate-800 rounded-full flex items-center justify-center text-slate-500 dark:text-slate-400 text-sm font-light">J</div>
      </div>
    </header>

    <!-- Content area -->
    <main class="flex-1 p-6 lg:p-16">
      <div class="max-w-3xl">
        <h1 class="text-2xl font-light text-slate-900 dark:text-white mb-2">Page Title</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-12 font-light">Page description goes here.</p>

        <div>
          <p class="text-slate-500 dark:text-slate-400 font-light text-sm leading-relaxed">Replace this with your page content. This shell provides the sidebar, topbar, and content area layout.</p>
        </div>
      </div>
    </main>
  </div>
</div>
