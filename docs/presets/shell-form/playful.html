<style>
@keyframes bounce-hover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
.btn-bounce:hover { animation: bounce-hover 300ms ease; }
</style>

<div class="min-h-screen bg-rose-50 dark:bg-slate-900 flex flex-col">

  <!-- Minimal header -->
  <header class="py-6 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto">
      <a href="#" class="text-lg font-bold text-rose-600 dark:text-rose-400">
        BrandName
      </a>
    </div>
  </header>

  <!-- Centered content -->
  <main class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="w-full max-w-md">

      <!-- Card with rounded-3xl and colorful shadow -->
      <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-[0_12px_40px_-8px_rgba(244,63,94,0.15)] dark:shadow-[0_12px_40px_-8px_rgba(244,63,94,0.1)] border border-rose-200 dark:border-slate-700 p-8 sm:p-10">

        <!-- Gradient accent bar -->
        <div
          class="h-1.5 w-16 mx-auto rounded-full bg-gradient-to-r from-rose-400 to-pink-500 mb-8"
          aria-hidden="true"
        ></div>

        <!-- Form header -->
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-slate-900 dark:text-white">
            Welcome back
          </h1>
          <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
            Sign in to your account to continue
          </p>
        </div>

        <!-- Form with rounded-xl inputs -->
        <form class="space-y-5">
          <div>
            <label
              for="email"
              class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2"
            >
              Email
            </label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
              class="w-full border border-rose-200 dark:border-slate-600 rounded-xl px-4 py-3 text-base bg-rose-50/50 dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all min-h-11"
            >
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2"
            >
              Password
            </label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              class="w-full border border-rose-200 dark:border-slate-600 rounded-xl px-4 py-3 text-base bg-rose-50/50 dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all min-h-11"
            >
          </div>

          <div class="pt-2">
            <button
              type="submit"
              class="btn-bounce w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-semibold py-3 rounded-full text-base transition-all min-h-11 shadow-[0_4px_16px_-4px_rgba(244,63,94,0.4)]"
            >
              Sign In
            </button>
          </div>
        </form>

        <!-- Footer link -->
        <p class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
          Don't have an account?
          <a
            href="#"
            class="text-rose-600 dark:text-rose-400 hover:underline font-semibold"
          >
            Sign up
          </a>
        </p>
      </div>

    </div>
  </main>
</div>
