<style>
@keyframes bounce-hover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
</style>

<div class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 flex flex-col">

  <!-- Minimal header -->
  <header class="py-6 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto">
      <a href="#" class="text-lg font-extrabold text-rose-600 dark:text-rose-400 focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:outline-none">
        BrandName
      </a>
    </div>
  </header>

  <!-- Centered content -->
  <main class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="w-full max-w-md">

      <!-- Card with rounded-2xl and colorful shadow -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-[0_16px_48px_-8px_rgba(244,63,94,0.2),0_8px_24px_-4px_rgba(147,51,234,0.1)] dark:shadow-[0_16px_48px_-8px_rgba(244,63,94,0.15),0_8px_24px_-4px_rgba(147,51,234,0.08)] border border-rose-100 dark:border-slate-700 p-8 sm:p-10 overflow-hidden relative">

        <!-- Gradient accent bar -->
        <div
          class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-rose-400 via-pink-500 to-purple-500"
          aria-hidden="true"
        ></div>

        <!-- Form header -->
        <div class="text-center mb-8 mt-2">
          <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">
            Welcome back!
          </h1>
          <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
            Sign in to your account to continue
          </p>
        </div>

        <!-- Form with rounded-xl inputs -->
        <form class="space-y-5">
          <div>
            <label
              for="email"
              class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2"
            >
              Email
            </label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              autocomplete="email"
              class="w-full border-2 border-rose-200 dark:border-slate-600 rounded-xl px-4 py-3 text-base bg-rose-50/60 dark:bg-slate-700/50 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-rose-400 focus:border-rose-400 dark:focus:ring-rose-500 dark:focus:border-rose-500 outline-none transition-all min-h-11"
            >
          </div>

          <div>
            <label
              for="password"
              class="block text-sm font-bold text-slate-700 dark:text-slate-200 mb-2"
            >
              Password
            </label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              class="w-full border-2 border-rose-200 dark:border-slate-600 rounded-xl px-4 py-3 text-base bg-rose-50/60 dark:bg-slate-700/50 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-rose-400 focus:border-rose-400 dark:focus:ring-rose-500 dark:focus:border-rose-500 outline-none transition-all min-h-11"
            >
          </div>

          <div class="pt-2">
            <button
              type="submit"
              class="hover:animate-[bounce-hover_300ms_ease] motion-reduce:hover:animate-none w-full bg-gradient-to-r from-rose-500 to-purple-500 hover:from-rose-600 hover:to-purple-600 text-white font-bold py-3.5 rounded-full text-base transition-all min-h-11 shadow-[0_6px_20px_-4px_rgba(244,63,94,0.4)] hover:shadow-[0_8px_28px_-4px_rgba(244,63,94,0.5)] hover:scale-[1.02] active:scale-[0.98]"
            >
              Sign In
            </button>
          </div>
        </form>

        <!-- Footer link -->
        <p class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
          Don't have an account?
          <a
            href="#"
            class="text-rose-600 dark:text-rose-400 hover:underline font-bold"
          >
            Sign up
          </a>
        </p>
      </div>

    </div>
  </main>
</div>
