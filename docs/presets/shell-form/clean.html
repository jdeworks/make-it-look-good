<!-- Centered Form Shell: Card on gray background -->
<!-- Drop form-login, form-signup, or form-contact inside the card -->
<div id="shellFormWrap" class="min-h-screen bg-slate-50 dark:bg-slate-900 flex flex-col">

  <!-- Minimal header -->
  <header class="py-6 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto">
      <a href="#" class="focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none text-lg font-bold text-slate-900 dark:text-white">BrandName</a>
    </div>
  </header>

  <!-- Centered content -->
  <main class="flex-1 flex items-center justify-center px-4 pb-12">
    <div class="w-full max-w-md">
      <!-- Card -->
      <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 sm:p-8">
        <!-- Form header -->
        <div class="text-center mb-8">
          <h1 class="text-2xl font-semibold text-slate-900 dark:text-white">Welcome back</h1>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Sign in to your account to continue</p>
        </div>

        <!-- Form content — replace with form-login, form-signup, etc. -->
        <form class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
            <input type="email" autocomplete="email" id="email" placeholder="you@example.com" class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-600 dark:placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11">
          </div>
          <div>
            <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
            <input type="password" id="password" placeholder="Enter your password" class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2.5 text-base bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-600 dark:placeholder-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none min-h-11">
          </div>
          <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg text-base transition-colors min-h-11">Sign In</button>
        </form>

        <!-- Footer link -->
        <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
          Don't have an account? <a href="#" class="focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none text-blue-700 dark:text-blue-400 hover:underline font-semibold">Sign up</a>
        </p>
      </div>
    </div>
  </main>
</div>
