<div class="min-h-screen bg-white dark:bg-slate-950 flex flex-col">

  <!-- Minimal header — logo only -->
  <header class="py-8 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto">
      <a
        href="#"
        class="text-base font-light text-slate-900 dark:text-white tracking-wide"
      >
        BrandName
      </a>
    </div>
  </header>

  <!-- Centered content — no card, form floats on page -->
  <main class="flex-1 flex items-center justify-center px-4 pb-16">
    <div class="w-full max-w-sm">

      <!-- Form heading with generous spacing -->
      <div class="text-center mb-12">
        <h1 class="text-2xl font-light text-slate-900 dark:text-white">
          Welcome back
        </h1>
        <p class="mt-3 text-sm text-slate-400 dark:text-slate-500 font-light">
          Sign in to your account to continue
        </p>
      </div>

      <!-- Form with underline inputs and tiny uppercase labels -->
      <form class="space-y-8">
        <div>
          <label
            for="email"
            class="block text-[11px] font-medium uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-3"
          >
            Email
          </label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full border-0 border-b border-slate-200 dark:border-slate-800 bg-transparent px-0 py-2.5 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 focus:border-slate-900 dark:focus:border-white focus:ring-0 outline-none transition-colors min-h-11"
          >
        </div>

        <div>
          <label
            for="password"
            class="block text-[11px] font-medium uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-3"
          >
            Password
          </label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            class="w-full border-0 border-b border-slate-200 dark:border-slate-800 bg-transparent px-0 py-2.5 text-base text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 focus:border-slate-900 dark:focus:border-white focus:ring-0 outline-none transition-colors min-h-11"
          >
        </div>

        <div class="pt-4">
          <button
            type="submit"
            class="w-full border border-slate-900 dark:border-white bg-transparent hover:bg-slate-900 hover:text-white dark:hover:bg-white dark:hover:text-slate-900 text-slate-900 dark:text-white font-normal py-3 rounded-lg text-base transition-colors min-h-11"
          >
            Sign In
          </button>
        </div>
      </form>

      <!-- Footer link -->
      <p class="mt-10 text-center text-sm text-slate-400 dark:text-slate-500 font-light">
        Don't have an account?
        <a href="#" class="text-slate-900 dark:text-white hover:underline">
          Sign up
        </a>
      </p>

    </div>
  </main>
</div>
