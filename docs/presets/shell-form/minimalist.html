<div class="shell-form-minimalist min-h-screen bg-white dark:bg-slate-950 flex flex-col">

  <!-- Minimal header — logo only -->
  <header class="py-8 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto">
      <a
        href="#"
        class="text-sm font-normal text-slate-900 dark:text-white tracking-[0.16em] uppercase"
      >
        BrandName
      </a>
    </div>
  </header>

  <!-- Centered content — no card, form floats on page -->
  <main class="flex-1 flex items-center justify-center px-4 pb-16">
    <div class="w-full max-w-xs">

      <!-- Form heading with generous spacing -->
      <div class="text-center mb-14">
        <h1 class="text-3xl font-normal text-slate-900 dark:text-white tracking-tight">
          Welcome back
        </h1>
        <p class="mt-3 text-sm text-slate-800 dark:text-slate-200 font-normal">
          Sign in to your account to continue
        </p>
      </div>

      <!-- Form with underline inputs and tiny uppercase labels -->
      <form class="space-y-10" aria-label="Sign in form">
        <div>
          <label
            for="email"
            class="block text-sm font-medium uppercase tracking-[0.12em] text-slate-900 dark:text-slate-100 mb-3"
          >
            Email
          </label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full border-0 border-b border-slate-600 dark:border-slate-400 bg-transparent px-0 py-2.5 text-base font-normal text-slate-950 dark:text-white placeholder:text-slate-800 dark:placeholder:text-slate-200 focus:border-black dark:focus:border-white focus:ring-0 outline-none transition-colors min-h-11"
          >
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium uppercase tracking-[0.12em] text-slate-900 dark:text-slate-100 mb-3"
          >
            Password
          </label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            class="w-full border-0 border-b border-slate-600 dark:border-slate-400 bg-transparent px-0 py-2.5 text-base font-normal text-slate-950 dark:text-white placeholder:text-slate-800 dark:placeholder:text-slate-200 focus:border-black dark:focus:border-white focus:ring-0 outline-none transition-colors min-h-11"
          >
        </div>

        <div class="pt-4">
          <button
            type="submit"
            class="w-full border border-black dark:border-white bg-transparent hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black text-slate-950 dark:text-white font-medium py-3 text-sm tracking-widest uppercase transition-colors min-h-11"
          >
            Sign In
          </button>
        </div>
      </form>

      <!-- Footer link -->
      <p class="mt-12 text-center text-sm text-slate-800 dark:text-slate-200 font-normal">
        Don't have an account?
        <a href="#" class="font-medium text-slate-950 dark:text-white hover:underline focus-visible:ring-2 focus-visible:ring-black dark:focus-visible:ring-white focus-visible:outline-none">
          Sign up
        </a>
      </p>

    </div>
  </main>
</div>
