<div class="flex h-screen bg-white">
  <!-- Sidebar -->
  <div class="w-48 bg-gray-100 border-r p-2">
    <div class="font-bold text-sm mb-3 px-1">MyApp</div>
    <a href="#" onclick="showPage('dash'); return false" class="block text-sm text-blue-600 py-1 px-1 mb-1 bg-blue-50">Dashboard</a>
    <a href="#" onclick="showPage('team'); return false" class="block text-sm text-gray-600 py-1 px-1 mb-1 hover:bg-gray-200">Team</a>
    <a href="#" onclick="showPage('settings'); return false" class="block text-sm text-gray-600 py-1 px-1 mb-1 hover:bg-gray-200">Settings</a>
  </div>
  <!-- Content -->
  <div class="flex-1 overflow-auto">
    <!-- Dashboard -->
    <div id="page-dash">
      <div class="p-4">
        <div class="text-xl font-bold mb-2">Dashboard</div>
        <div class="flex gap-2 mb-4">
          <div class="bg-blue-100 p-3 rounded w-1/3">
            <div class="text-xs text-blue-800">Revenue</div>
            <div class="text-lg font-bold text-blue-900">$12,340</div>
          </div>
          <div class="bg-blue-50 p-2 rounded w-1/3">
            <div class="text-xs text-blue-700">Users</div>
            <div class="text-2xl font-bold text-blue-800">847</div>
          </div>
          <div class="bg-blue-200 p-4 rounded w-1/3">
            <div class="text-sm text-blue-900">Orders</div>
            <div class="text-base font-bold text-blue-900">156</div>
          </div>
        </div>
        <table class="w-full text-sm">
          <thead><tr class="text-left border-b"><th class="py-1">Name</th><th>Status</th><th>Amount</th></tr></thead>
          <tbody>
            <tr class="border-b"><td class="py-1">Order #1042</td><td><span class="text-green-600 text-xs">Paid</span></td><td>$250</td></tr>
            <tr class="border-b"><td class="py-1">Order #1041</td><td><span class="text-yellow-600 text-xs">Pending</span></td><td>$180</td></tr>
            <tr><td class="py-1">Order #1040</td><td><span class="text-red-500 text-xs">Failed</span></td><td>$95</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- Team -->
    <div id="page-team" style="display:none">
      <div class="p-3">
        <div class="text-lg font-bold mb-3 text-green-700">Team Members</div>
        <div class="space-y-1">
          <div class="flex justify-between items-center p-2 bg-green-50 rounded">
            <div>
              <div class="font-bold text-sm">Alice Johnson</div>
              <div class="text-xs text-gray-500">Engineering Lead</div>
            </div>
            <button class="bg-green-500 text-white text-xs px-2 py-0.5 rounded-full focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none">Message</button>
          </div>
          <div class="flex justify-between items-center p-2 bg-green-50">
            <div>
              <div class="font-bold text-sm">Bob Smith</div>
              <div class="text-xs text-gray-500">Designer</div>
            </div>
            <button class="bg-green-600 text-white text-xs px-3 py-1 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none">Message</button>
          </div>
          <div class="flex justify-between items-center p-3 bg-green-50 rounded-lg">
            <div>
              <div class="font-semibold">Carol Davis</div>
              <div class="text-xs text-gray-400">Product Manager</div>
            </div>
            <button class="bg-green-400 text-white text-xs px-2 py-1 rounded-md focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none">Message</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Settings -->
    <div id="page-settings" style="display:none">
      <div class="p-2">
        <div class="text-2xl font-semibold mb-4 text-purple-700">Settings</div>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-purple-600 font-bold">Display Name</label>
            <input type="text" value="John Doe" class="block w-full border border-purple-300 rounded px-2 py-1 text-sm mt-0.5">
          </div>
          <div>
            <label class="text-xs text-gray-600">Email</label>
            <input type="email" value="john@example.com" class="block w-full border rounded-lg px-3 py-2 text-sm mt-1">
          </div>
          <div>
            <label class="text-sm text-purple-800 font-semibold">Timezone</label>
            <select class="block w-full border border-gray-300 px-2 py-1 text-sm mt-0.5 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none">
              <option>UTC-8 Pacific</option>
              <option>UTC-5 Eastern</option>
            </select>
          </div>
          <div class="flex items-center gap-2 mt-2">
            <input type="checkbox" checked>
            <label class="text-xs">Enable notifications</label>
          </div>
          <button class="bg-purple-500 text-white px-4 py-1 rounded text-sm mt-2 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none">Save Changes</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function showPage(page) {
  document.getElementById('page-dash').style.display = page === 'dash' ? '' : 'none';
  document.getElementById('page-team').style.display = page === 'team' ? '' : 'none';
  document.getElementById('page-settings').style.display = page === 'settings' ? '' : 'none';
  var links = document.querySelectorAll('.w-48 a');
  links.forEach(function(l) { l.className = 'block text-sm text-gray-600 py-1 px-1 mb-1 hover:bg-gray-200'; });
  var idx = page === 'dash' ? 0 : page === 'team' ? 1 : 2;
  links[idx].className = 'block text-sm text-blue-600 py-1 px-1 mb-1 bg-blue-50';
}
</script>
