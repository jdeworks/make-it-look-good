<div class="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-white dark:bg-slate-950"><div class="w-full max-w-md">
<div class="flex flex-wrap items-center gap-2 py-3">
  <button class="inline-flex items-center gap-2 min-h-11 px-4 py-2 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">
    Edit
  </button>
  <button class="inline-flex items-center gap-2 min-h-11 px-4 py-2 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors">
    Analytics
  </button>
  <div class="relative inline-block text-left" id="dropdown-wrapper">
  <button
    type="button"
    class="inline-flex items-center gap-2 min-h-11 px-4 py-2 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
    aria-haspopup="true"
    aria-expanded="false"
    id="dropdown-trigger"
    onclick="toggleDropdown()"
  >
    Options
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
  </button>

  <div
    class="absolute left-0 sm:left-auto sm:right-0 z-50 mt-1 w-48 max-w-[calc(100vw-2rem)] origin-top-left sm:origin-top-right bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 hidden"
    role="menu"
    aria-orientation="vertical"
    aria-labelledby="dropdown-trigger"
    id="dropdown-menu"
  >
    <div class="py-0.5">
      <button role="menuitem" class="flex w-full min-h-11 px-4 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors text-left" tabindex="-1">
        Edit
      </button>
      <button role="menuitem" class="flex w-full min-h-11 px-4 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors text-left" tabindex="-1">
        Duplicate
      </button>
      <button role="menuitem" class="flex w-full min-h-11 px-4 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors text-left" tabindex="-1">
        Archive
      </button>
    </div>
    <div class="border-t border-slate-100 dark:border-slate-800"></div>
    <div class="py-0.5">
      <button role="menuitem" class="flex w-full min-h-11 px-4 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors text-left" tabindex="-1">
        Share
      </button>
      <button role="menuitem" class="flex w-full min-h-11 px-4 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors text-left" tabindex="-1">
        Favorite
      </button>
    </div>
    <div class="border-t border-slate-100 dark:border-slate-800"></div>
    <div class="py-0.5">
      <button role="menuitem" class="flex w-full min-h-11 px-4 py-2.5 text-sm font-light text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition-colors text-left" tabindex="-1">
        Delete
      </button>
    </div>
  </div>
</div>

<script>
function toggleDropdown() {
  const btn = document.getElementById('dropdown-trigger');
  const menu = document.getElementById('dropdown-menu');
  const isOpen = !menu.classList.contains('hidden');
  if (isOpen) { closeDropdown(); } else {
    menu.classList.remove('hidden');
    btn.setAttribute('aria-expanded', 'true');
    const firstItem = menu.querySelector('[role="menuitem"]');
    if (firstItem) firstItem.focus();
  }
}
function closeDropdown() {
  const btn = document.getElementById('dropdown-trigger');
  const menu = document.getElementById('dropdown-menu');
  menu.classList.add('hidden');
  btn.setAttribute('aria-expanded', 'false');
}
document.addEventListener('click', (e) => {
  if (!document.getElementById('dropdown-wrapper').contains(e.target)) closeDropdown();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDropdown();
  const menu = document.getElementById('dropdown-menu');
  if (menu.classList.contains('hidden')) return;
  const items = [...menu.querySelectorAll('[role="menuitem"]')];
  const idx = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(idx + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(idx - 1 + items.length) % items.length].focus(); }
});
</script>
</div>
</div></div>
