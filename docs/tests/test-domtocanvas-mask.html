.result { font-family: monospace; font-size: 11px; white-space: pre-wrap; background: #f1f5f9; padding: 8px; border-radius: 4px; margin-top: 8px; max-height: 300px; overflow: auto; }

</head>
<body>
<h1>domToCanvas Text Mask Diagnostic</h1>
<p class="desc">Tests what causes modern-screenshot's domToCanvas to fail rendering text as black on white.
Each variation is captured and checked for dark pixels at the element's position.</p>

<div class="controls">
  <button onclick="runAllTests()">Run Synthetic Tests</button>
  <button class="secondary" onclick="document.getElementById('results').innerHTML='';results=[]">Clear</button>
</div>
<div style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
  <input id="urlInput" type="text" placeholder="https://example.com — test with real page HTML" style="flex:1;padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px">
  <button onclick="runUrlTest()">Test URL</button>
</div>
<div id="results"></div>

<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.8/dist/index.js"></script>
<script>
var MS = window.modernScreenshot;
var SCALE = 0.75;
var results = [];
var resultsEl = document.getElementById('results');

function log(section, msg, type) {
  results.push({ section: section, msg: msg, type: type || 'info' });
  render();
}

function render() {
  var grouped = {};
  results.forEach(function(r) {
    if (!grouped[r.section]) grouped[r.section] = [];
    grouped[r.section].push(r);
  });
  var html = '';
  Object.keys(grouped).forEach(function(sec) {
    html += '<div class="test-section"><h3>' + sec + '</h3><div class="result">';
    grouped[sec].forEach(function(r) {
      html += '<div class="' + r.type + '">' + r.msg + '</div>';
    });
    html += '</div></div>';
  });
  resultsEl.innerHTML = html;
}

// ---- Build a test page with all variations ----
function buildTestPage() {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<style>' +
    '*, *::before, *::after { box-sizing: border-box; }' +

    '.cell { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 4px; min-width: 150px; }' +
    '.cell-label { font-size: 10px; color: #94a3b8; margin-bottom: 4px; }' +

    // ======= GROUP 1: Tag types =======
    // Plain text in different tags — which tags does domToCanvas handle?

    '.g1-a { color: #000; text-decoration: none; }' +
    '.g1-button { color: #000; background: transparent; border: none; font: inherit; padding: 0; cursor: pointer; }' +

    // ======= GROUP 2: CSS transitions =======
    // Does transition-property on color cause issues?
    '.g2-no-trans { color: #000; }' +
    '.g2-trans-color { color: #000; transition: color 0.15s ease; }' +
    '.g2-trans-all { color: #000; transition: all 0.3s ease; }' +
    '.g2-trans-opacity { color: #000; transition: opacity 0.3s ease; }' +
    '.g2-trans-transform { color: #000; transition: transform 0.3s ease; }' +
    '.g2-trans-colors { color: #000; transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(.4,0,.2,1); transition-duration: .15s; }' +

    // ======= GROUP 3: Animations =======
    '@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }' +
    '@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }' +

    // ======= GROUP 5: Position =======

    '.g5-absolute { color: #000; position: absolute; top: 0; left: 0; }' +
    '.g5-fixed-wrap { height: 40px; }' +
    '.g5-fixed { color: #000; position: fixed; top: auto; left: auto; }' + // not actually fixed to viewport for test
    '.g5-sticky { color: #000; position: sticky; top: 0; }' +

    // ======= GROUP 6: Display/inline =======

    '.g8-parent-blue { color: blue; }' +

          '<h3 style="color:#1e293b;margin:0 0 8px" data-test="g12-card3-h3">Feature Three</h3>' +
          '<p style="color:#64748b;margin:0" data-test="g12-card3-p">Third card to test grid layout impact.</p>' +
        '</div>' +
      '</div>' +
    '</section>' +
    '<section style="min-height:300px;padding:60px 40px;background:#1e293b">' +
      '<h2 style="color:#fff;font-size:28px;margin:0 0 16px" data-test="g12-dark-h2">Dark Section</h2>' +
      '<p style="color:#94a3b8;margin:0" data-test="g12-dark-p">Text on a dark background section.</p>' +
    '</section>' +
    '<footer style="padding:20px 40px;background:#0f172a;display:flex;gap:16px">' +
      '<a href="#" style="color:#64748b;text-decoration:none;transition:color .15s" data-test="g12-footer1">Privacy</a>' +
      '<a href="#" style="color:#64748b;text-decoration:none;transition:color .15s" data-test="g12-footer2">Terms</a>' +
      '<a href="#" style="color:#64748b;text-decoration:none;transition:color .15s" data-test="g12-footer3">Contact</a>' +
    '</footer>' +

    '</body></html>';
}

// ---- Capture and analyze ----
function runAllTests() {
  results = [];
  log('Setup', 'Creating test iframe...');

  var iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1280px;height:900px;border:none;';
  document.body.appendChild(iframe);

  iframe.srcdoc = buildTestPage();
  iframe.onload = function() {
    setTimeout(function() {
      runCapture(iframe);
    }, 500); // let animations start
  };
}

function runUrlTest() {
  var url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  results = [];
  log('URL Test', 'Fetching ' + url + ' via proxy...');

  var proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://api.codetabs.com/v1/proxy?quest=',
    'https://corsproxy.io/?'
  ];

  // Try direct then proxies
  var chain = fetch(url, { mode: 'cors' }).then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); }).catch(function() {
    var c = Promise.reject();
    proxies.forEach(function(p) { c = c.catch(function() { return fetch(p + encodeURIComponent(url)).then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); }); }); });
    return c;
  });

  chain.then(function(html) {
    log('URL Test', 'Got ' + html.length + ' chars, loading into iframe...');

    // Inject <base> tag for relative URLs
    try {
      var base = new URL(url);
      var baseHref = base.origin + base.pathname.replace(/\/[^/]*$/, '/');
      var baseTag = '<base href="' + baseHref + '">';
      if (/<head[\s>]/i.test(html)) html = html.replace(/<head([^>]*)>/i, '<head$1>' + baseTag);
      else html = baseTag + html;
    } catch(e) {}

    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1280px;height:900px;border:none;';
    iframe.sandbox = 'allow-scripts allow-same-origin';
    document.body.appendChild(iframe);
    iframe.srcdoc = html;

    iframe.onload = function() {
      setTimeout(function() {
        runUrlCapture(iframe, url);
      }, 2000); // longer wait for real pages to render
    };
  }).catch(function(err) {
    log('URL Test', 'Fetch failed: ' + err.message, 'fail');
  });
}

function runUrlCapture(iframe, url) {
  var doc = iframe.contentDocument;

  // Find ALL text elements (like the real extractor does)
  var textEls = [];
  var walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, null, false);
  var node;
  while (node = walker.nextNode()) {
    if (!node.textContent.trim()) continue;
    var el = node.parentElement;
    if (!el || el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'NOSCRIPT') continue;
    var r = el.getBoundingClientRect();
    if (r.width < 3 || r.height < 3) continue;
    // Deduplicate by element
    if (textEls.some(function(te) { return te.el === el; })) continue;
    textEls.push({ el: el, text: el.textContent.substring(0, 40).trim() });
  }

  log('URL Test', 'Found ' + textEls.length + ' text elements');

  // Collect bboxes
  var elements = textEls.map(function(te) {
    var r = te.el.getBoundingClientRect();
    return {
      el: te.el,
      name: te.text.substring(0, 25),
      text: te.text,
      bbox: { left: r.left + (iframe.contentWindow.scrollX || 0), top: r.top + (iframe.contentWindow.scrollY || 0), width: r.width, height: r.height },
      cs: {
        color: getComputedStyle(te.el).color,
        display: getComputedStyle(te.el).display,
        position: getComputedStyle(te.el).position,
        transition: getComputedStyle(te.el).transition
      }
    };
  });

  // Pass 1: capture as-is
  capturePass(iframe, 'URL Pass 1: As-is', elements, function() {
    // Apply mask style
    applyMaskStyle(doc, elements);
    killTransitions(doc);
    setTimeout(function() {
      // Check drift
      checkBboxDrift(doc, elements);
      // Pass 2: mask with pre-mask bboxes
      capturePass(iframe, 'URL Pass 2: Mask (pre-mask bboxes)', elements, function() {
        // Pass 3: re-read bboxes after mask
        elements.forEach(function(e) {
          var r = e.el.getBoundingClientRect();
          e.bboxPost = { left: r.left, top: r.top, width: r.width, height: r.height };
        });
        capturePassWithBbox(iframe, 'URL Pass 3: Mask (post-mask bboxes)', elements, 'bboxPost', function() {
          if (iframe.parentNode) document.body.removeChild(iframe);
          // Summarize URL results
          summarize(elements);
        });
      });
    }, 500);
  });
}

function runCapture(iframe) {
  var doc = iframe.contentDocument;
  var testEls = doc.querySelectorAll('[data-test]');
  log('Setup', 'Found ' + testEls.length + ' test elements');

  // Collect bboxes while page is normal
  var elements = [];
  testEls.forEach(function(el) {
    var r = el.getBoundingClientRect();
    elements.push({
      el: el,
      name: el.getAttribute('data-test'),
      text: el.textContent,
      bbox: { left: r.left, top: r.top, width: r.width, height: r.height },
      cs: {
        color: getComputedStyle(el).color,
        fill: getComputedStyle(el).webkitTextFillColor,
        display: getComputedStyle(el).display,
        position: getComputedStyle(el).position,
        transition: getComputedStyle(el).transition,
        animation: getComputedStyle(el).animation
      }
    });
  });

  log('Setup', 'Bboxes captured, running 4 test passes...');

  // === Pass 1: Capture page as-is (black text, normal styling) ===
  capturePass(iframe, 'Pass 1: As-is (normal page)', elements, function() {
    // === Pass 2: White background + black text override (our mask approach) ===
    applyMaskStyle(doc, elements);
    setTimeout(function() {
      // === Bbox drift check: compare pre-mask vs post-mask positions ===
      checkBboxDrift(doc, elements);

      capturePass(iframe, 'Pass 2: Mask style (white bg + inline black)', elements, function() {
        // === Pass 3: Mask + kill transitions + wait ===
        killTransitions(doc);
        setTimeout(function() {
          capturePass(iframe, 'Pass 3: Mask + transitions killed + 500ms wait', elements, function() {
            // === Pass 4: Use POST-MASK bboxes instead of pre-mask ===
            // Re-read bboxes after mask is applied to test if drift causes failures
            elements.forEach(function(e) {
              var r = e.el.getBoundingClientRect();
              e.bboxPost = { left: r.left, top: r.top, width: r.width, height: r.height };
            });
            capturePassWithBbox(iframe, 'Pass 4: Post-mask bboxes (drift-corrected)', elements, 'bboxPost', function() {
              // Cleanup
              if (iframe.parentNode) document.body.removeChild(iframe);
              summarize(elements);
            });
          });
        }, 500);
      });
    }, 100);
  });
}

function checkBboxDrift(doc, elements) {
  var sec = 'Bbox Drift Check';
  var drifted = 0;
  elements.forEach(function(e) {
    var r = e.el.getBoundingClientRect();
    var dx = Math.abs(r.left - e.bbox.left);
    var dy = Math.abs(r.top - e.bbox.top);
    var dw = Math.abs(r.width - e.bbox.width);
    var dh = Math.abs(r.height - e.bbox.height);
    if (dx > 2 || dy > 2 || dw > 2 || dh > 2) {
      drifted++;
      log(sec, '  DRIFT ' + e.name + ': Δleft=' + dx.toFixed(0) + ' Δtop=' + dy.toFixed(0) + ' Δw=' + dw.toFixed(0) + ' Δh=' + dh.toFixed(0) +
        ' (was: ' + Math.round(e.bbox.left) + ',' + Math.round(e.bbox.top) + ' ' + Math.round(e.bbox.width) + 'x' + Math.round(e.bbox.height) +
        ' → now: ' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ')', 'fail');
    }
  });
  if (drifted === 0) {
    log(sec, 'No drift detected — all bboxes stable after mask style (' + elements.length + ' elements)', 'pass');
  } else {
    log(sec, drifted + '/' + elements.length + ' elements drifted after mask style applied!', 'fail');
  }
}

function capturePassWithBbox(iframe, passName, elements, bboxKey, callback) {
  var doc = iframe.contentDocument;
  log(passName, 'Capturing with domToCanvas using ' + bboxKey + ' bboxes...');

  MS.domToCanvas(doc.documentElement, { scale: SCALE, timeout: 15000 }).then(function(canvas) {
    log(passName, 'Canvas: ' + canvas.width + 'x' + canvas.height);
    var ctx = canvas.getContext('2d', { willReadFrequently: true });

    var passed = 0, failed = 0;
    elements.forEach(function(e) {
      var bb = e[bboxKey];
      if (!bb || bb.width < 1 || bb.height < 1) return;
      var bx = Math.max(0, Math.round(bb.left * SCALE));
      var by = Math.max(0, Math.round(bb.top * SCALE));
      var bw = Math.min(Math.round(bb.width * SCALE), canvas.width - bx);
      var bh = Math.min(Math.round(bb.height * SCALE), canvas.height - by);
      if (bw < 2 || bh < 2) { failed++; return; }

      try {
        var px = ctx.getImageData(bx, by, bw, bh).data;
        var darkCount = 0;
        for (var i = 0; i < px.length; i += 4) {
          if ((px[i] + px[i + 1] + px[i + 2]) / 3 < 200) darkCount++;
        }
        if (!e.passes) e.passes = {};
        var ci = (Math.floor(bh / 2) * bw + Math.floor(bw / 2)) * 4;
        var centerRgb = 'rgb(' + px[ci] + ',' + px[ci + 1] + ',' + px[ci + 2] + ')';
        e.passes[passName] = { dark: darkCount, total: bw * bh, center: centerRgb, bw: bw, bh: bh };
        if (darkCount > 0) { passed++; log(passName, '  PASS ' + e.name + ': ' + darkCount + ' dark px center=' + centerRgb, 'pass'); }
        else { failed++; log(passName, '  FAIL ' + e.name + ': 0 dark px center=' + centerRgb, 'fail'); }
      } catch (ex) { failed++; }
    });

    log(passName, passed + ' passed, ' + failed + ' failed', passed > 0 && failed === 0 ? 'pass' : 'fail');
    callback();
  }).catch(function(err) {
    log(passName, 'domToCanvas FAILED: ' + err.message, 'fail');
    callback();
  });
}

function applyMaskStyle(doc, elements) {
  var style = doc.createElement('style');
  style.setAttribute('data-milg-test', '1');
  style.textContent = '*, *::before, *::after { color: #fff !important; background-color: #fff !important; background-image: none !important; background: white !important; border-color: transparent !important; box-shadow: none !important; text-shadow: none !important; -webkit-text-fill-color: #fff !important; opacity: 1 !important; } img, svg, video, canvas { opacity: 0 !important; }';
  doc.head.appendChild(style);

  // Set target elements to black via inline style
  elements.forEach(function(e) {
    e.el.style.setProperty('color', '#000', 'important');
    e.el.style.setProperty('-webkit-text-fill-color', '#000', 'important');
  });
  doc.body.offsetHeight; // force reflow
}

function killTransitions(doc) {
  doc.querySelectorAll('*').forEach(function(el) {
    el.style.setProperty('transition', 'none', 'important');
    el.style.setProperty('transition-duration', '0s', 'important');
    el.style.setProperty('animation', 'none', 'important');
  });
  doc.body.offsetHeight;
}

function capturePass(iframe, passName, elements, callback) {
  var doc = iframe.contentDocument;
  log(passName, 'Capturing with domToCanvas...');

  MS.domToCanvas(doc.documentElement, { scale: SCALE, timeout: 15000 }).then(function(canvas) {
    log(passName, 'Canvas: ' + canvas.width + 'x' + canvas.height);
    var ctx = canvas.getContext('2d', { willReadFrequently: true });

    var passed = 0, failed = 0;
    elements.forEach(function(e) {
      var bx = Math.max(0, Math.round(e.bbox.left * SCALE));
      var by = Math.max(0, Math.round(e.bbox.top * SCALE));
      var bw = Math.min(Math.round(e.bbox.width * SCALE), canvas.width - bx);
      var bh = Math.min(Math.round(e.bbox.height * SCALE), canvas.height - by);
      if (bw < 2 || bh < 2) { log(passName, '  ' + e.name + ': TOO SMALL (' + bw + 'x' + bh + ')', 'fail'); failed++; return; }

      try {
        var px = ctx.getImageData(bx, by, bw, bh).data;
        var darkCount = 0;
        for (var i = 0; i < px.length; i += 4) {
          if ((px[i] + px[i + 1] + px[i + 2]) / 3 < 200) darkCount++;
        }
        // Sample center pixel
        var ci = (Math.floor(bh / 2) * bw + Math.floor(bw / 2)) * 4;
        var centerRgb = 'rgb(' + px[ci] + ',' + px[ci + 1] + ',' + px[ci + 2] + ')';

        // Store result on element for summary
        if (!e.passes) e.passes = {};
        e.passes[passName] = { dark: darkCount, total: bw * bh, center: centerRgb, bw: bw, bh: bh };

        var pct = (darkCount / (bw * bh) * 100).toFixed(1);
        if (darkCount > 0) {
          log(passName, '  PASS ' + e.name + ': ' + darkCount + ' dark px (' + pct + '%) center=' + centerRgb, 'pass');
          passed++;
        } else {
          var extra = ' cs.trans=' + (e.cs.transition || 'none').substring(0, 40);
          log(passName, '  FAIL ' + e.name + ': 0 dark px, center=' + centerRgb + extra, 'fail');
          failed++;
        }
      } catch (ex) {
        log(passName, '  ERROR ' + e.name + ': ' + ex.message, 'fail');
        failed++;
      }
    });

    log(passName, passed + ' passed, ' + failed + ' failed out of ' + elements.length, passed > 0 && failed === 0 ? 'pass' : 'fail');
    callback();
  }).catch(function(err) {
    log(passName, 'domToCanvas FAILED: ' + err.message, 'fail');
    callback();
  });
}

function summarize(elements) {
  var sec = 'Summary';
  log(sec, '=== COMPARISON: Which elements fail and when? ===');

  var passNames = [];
  elements.forEach(function(e) {
    if (e.passes) Object.keys(e.passes).forEach(function(p) { if (passNames.indexOf(p) === -1) passNames.push(p); });
  });

  // Find elements that pass in one mode but fail in another
  var alwaysPass = [], alwaysFail = [], sometimesFail = [];
  elements.forEach(function(e) {
    if (!e.passes) { alwaysFail.push(e); return; }
    var hasPass = false, hasFail = false;
    passNames.forEach(function(p) {
      if (e.passes[p]) {
        if (e.passes[p].dark > 0) hasPass = true; else hasFail = true;
      }
    });
    if (hasPass && !hasFail) alwaysPass.push(e);
    else if (!hasPass && hasFail) alwaysFail.push(e);
    else sometimesFail.push(e);
  });

  log(sec, 'Always PASS (' + alwaysPass.length + '): ' + alwaysPass.map(function(e) { return e.name; }).join(', '), 'pass');
  log(sec, 'Always FAIL (' + alwaysFail.length + '): ' + alwaysFail.map(function(e) { return e.name; }).join(', '), alwaysFail.length > 0 ? 'fail' : 'pass');
  log(sec, 'Sometimes fail (' + sometimesFail.length + '):', sometimesFail.length > 0 ? 'fail' : 'pass');
  sometimesFail.forEach(function(e) {
    var detail = passNames.map(function(p) {
      if (!e.passes[p]) return p + ':?';
      return p + ':' + (e.passes[p].dark > 0 ? 'PASS(' + e.passes[p].dark + 'dk)' : 'FAIL');
    }).join(' | ');
    log(sec, '  ' + e.name + ' → ' + detail, 'fail');
  });

  // Group failures by CSS properties
  var failedEls = alwaysFail.concat(sometimesFail);
  if (failedEls.length > 0) {
    log(sec, '');
    log(sec, '=== FAILURE PATTERN ANALYSIS ===');
    var byTag = {}, byDisplay = {}, byTrans = {};
    failedEls.forEach(function(e) {
      var tag = e.el.tagName;
      byTag[tag] = (byTag[tag] || 0) + 1;
      byDisplay[e.cs.display] = (byDisplay[e.cs.display] || 0) + 1;
      var t = e.cs.transition ? (e.cs.transition === 'none 0s ease 0s' || e.cs.transition === 'all 0s ease 0s' ? 'none' : 'HAS_TRANSITION') : 'none';
      byTrans[t] = (byTrans[t] || 0) + 1;
    });
    log(sec, 'By tag: ' + JSON.stringify(byTag));
    log(sec, 'By display: ' + JSON.stringify(byDisplay));
    log(sec, 'By transition: ' + JSON.stringify(byTrans));
  }
}
