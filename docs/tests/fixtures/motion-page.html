<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Motion fixture</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; color: #1a1a1a; background: #fff; max-width: 800px; }
  h1 { font-size: 32px; }
  p { font-size: 16px; line-height: 1.6; max-width: 60ch; }
  /* An infinitely-looping animation, auto-running at load — and NO prefers-reduced-motion path. */
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .spinner { width: 40px; height: 40px; border: 4px solid #2563eb; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  .badge { display: inline-block; padding: 6px 12px; background: #2563eb; color: #fff; border-radius: 6px; animation: pulse 2s ease-in-out infinite; }
  /* A deliberately long (sluggish) animation. */
  @keyframes slideIn { from { transform: translateX(-40px); } to { transform: translateX(0); } }
  .hero { animation: slideIn 1.6s ease-out; will-change: transform; }
  .btn { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; min-height: 44px; transition: background 0.2s; }
  .btn:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <h1 class="hero">Motion test page</h1>
  <p>This page has auto-running, infinitely-looping animations and a long slide-in, with no
     <code>prefers-reduced-motion</code> path — the Motion &amp; Animation scorer should flag it.</p>
  <div class="spinner" aria-hidden="true"></div>
  <span class="badge">Live</span>
  <p><button class="btn">A button with a normal 200ms transition</button></p>
</body>
</html>
