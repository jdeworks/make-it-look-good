<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touch Target Fixture</title>
  <style>
    body {
      margin: 0;
      padding: 48px;
      font-family: system-ui, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    p {
      max-width: 62ch;
      line-height: 1.5;
    }
    .tiny-link {
      font-size: 14px;
    }
    .button-like {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: 1px solid #2563eb;
      border-radius: 4px;
      background: #dbeafe;
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 700;
    }
    .tiny-button {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 1px solid #dc2626;
      border-radius: 4px;
      background: #fee2e2;
      color: #7f1d1d;
    }
  </style>
</head>
<body>
  <main>
    <h1>Touch targets</h1>
    <p>
      This sentence contains a small <a class="tiny-link" href="#inline">normal inline text link</a>
      that should be exempt from target-size failures.
    </p>
    <a class="button-like" href="#action" aria-label="Tiny action">↗</a>
    <button class="tiny-button" aria-label="Tiny delete">×</button>
  </main>
</body>
</html>
