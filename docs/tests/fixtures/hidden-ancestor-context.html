<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hidden Ancestor Context Fixture</title>
  <style>
    :root {
      color-scheme: dark;
      --panel-bg: #020617;
      --panel-fg: #f8fafc;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: #f8fafc;
    }
    .app-shell {
      min-height: 100vh;
      padding: 48px;
      background: #f8fafc;
      color: #0f172a;
    }
    .app-shell.dark {
      background: #020617;
      color: #f8fafc;
    }
    .panel {
      width: 360px;
      padding: 24px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      background: var(--panel-bg);
      color: var(--panel-fg);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0 14px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      background: #e2e8f0;
      color: #0f172a;
      font: inherit;
    }
    .app-shell.dark .btn {
      min-height: 44px;
      background: #0f172a;
      color: #f8fafc;
      border-color: var(--accent);
    }
  </style>
</head>
<body class="dark-theme">
  <main class="app-shell dark" data-theme="dark">
    <h1>Ancestor context fixture</h1>
    <p>The hidden panel below should be analyzed with the surrounding dark app shell.</p>
    <section class="panel" hidden aria-label="Hidden settings panel">
      <h2>Hidden settings</h2>
      <p>This hidden section has enough content for region capture and uses inherited dark styling.</p>
      <button class="btn" id="hiddenAncestorBtn">Hidden action</button>
    </section>
  </main>
</body>
</html>
