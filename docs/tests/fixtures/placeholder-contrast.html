<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Placeholder Contrast Fixture</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --placeholder: #64748b;
      --border: #334155;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, sans-serif;
    }
    label {
      display: grid;
      gap: 8px;
      width: 360px;
    }
    input {
      min-height: 44px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }
  </style>
</head>
<body>
  <label>
    Website URL
    <input type="url" placeholder="https://example.com">
  </label>
</body>
</html>
