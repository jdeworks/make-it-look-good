<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moving Carousel Test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #fff; color: #172033; }
  .carousel-section { max-width: 920px; margin: 0 auto; }
  .carousel-container { width: 360px; margin: 20px 0; }
  .carousel { position: relative; max-width: 360px; }
  .carousel-track-container { overflow: hidden; border-radius: 12px; border: 1px solid #cbd5e1; }
  .carousel-track { display: flex; transition: transform 0.5s ease-in-out; transform: translateX(0); }
  .carousel-slide { min-width: 100%; aspect-ratio: 3 / 4; padding: 22px; box-sizing: border-box; }
  .slide-one { background: #eef2ff; }
  .slide-two { background: #ecfdf5; }
  .slide-three { background: #fff7ed; }
  h2 { margin: 0 0 10px; color: #0f172a; font-size: 24px; }
  p { margin: 0; color: #334155; font-size: 16px; line-height: 1.5; }
</style>
</head>
<body>
  <main>
    <section class="carousel-section">
      <h1>Moving Carousel</h1>
      <div class="carousel-container">
        <div class="carousel">
          <div class="carousel-track-container">
            <div class="carousel-track">
              <div class="carousel-slide slide-one"><h2>Slide One Heading</h2><p>First slide body content should be captured.</p></div>
              <div class="carousel-slide slide-two"><h2>Slide Two Heading</h2><p>Second slide body content should be captured.</p></div>
              <div class="carousel-slide slide-three"><h2>Slide Three Heading</h2><p>Third slide body content should be captured.</p></div>
            </div>
          </div>
        </div>
      </div>
      <p>Below carousel text.</p>
    </section>
  </main>
<script>
  (function () {
    var track = document.querySelector('.carousel-track');
    var idx = 0;
    function tick() {
      idx = (idx + 1) % 3;
      track.style.transform = 'translateX(-' + (idx * 100) + '%)';
    }
    setInterval(tick, 700);
  })();
</script>
</body>
</html>
